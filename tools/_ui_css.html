<style>
/* ============================================================
   SY · AdGuard Home × Shadowrocket 融合面板
   —— 布局骨架取自 AdGuard Home（玻璃 header + 卡片栅格）
   —— 信息密度与交互取自 Shadowrocket / Clash 系客户端
   —— 视觉走「极客终端」路线：深色优先、等宽数字、发丝描边

   性能契约（真机受控实验锁定的根因，不得违反）：
   1. backdrop-filter 只允许出现在 .header 与浮层 .dropdown-menu，
      绝不下放到 .card / .btn / 输入框 —— 否则几百个元素各开一层
      背景模糊，低端机必卡死。
   2. 不使用 SVG feTurbulence 噪点层（每帧重算，代价极高）。
   3. 全页禁止 CSS animation / keyframes；过渡只作用于
      transform / opacity / background-color / border-color / color。
   4. position:fixed 元素 ≤ 3（当前：body::before、#toast）。
   ============================================================ */

:root{
  /* ---- 底色（深色优先）---- */
  --bgcolor:#0b0f14;
  --bgcolor-2:#0f151c;
  --mcolor:#e6edf3;
  --scolor:#8b949e;
  --border-color:rgba(255,255,255,.07);
  --card-border-color:rgba(255,255,255,.09);

  /* ---- 卡片与玻璃 ---- */
  --card-1:rgba(22,27,34,.92);
  --card-2:rgba(17,22,29,.86);
  --card-head:rgba(255,255,255,.028);
  --ctrl-bg:rgba(22,27,34,.92);
  --ctrl-border:rgba(255,255,255,.12);
  --hover:rgba(255,255,255,.05);
  --glass-bg:rgba(11,15,20,.74);
  --glass-edge:rgba(255,255,255,.08);
  --glass-blur:16px;

  /* ---- 强调色 ---- */
  --accent:#58a6ff;
  --accent-soft:rgba(88,166,255,.14);
  --accent-2:#a371f7;
  --green:#3fb950;
  --green-hover:#4ac463;
  --green-soft:rgba(63,185,80,.14);
  --blue:#58a6ff;
  --blue-soft:rgba(88,166,255,.14);
  --red:#f85149;
  --red-soft:rgba(248,81,73,.14);
  --amber:#d29922;
  --amber-soft:rgba(210,153,34,.15);
  --purple:#a371f7;
  --purple-soft:rgba(163,113,247,.14);
  --cyan:#2dd4bf;
  --cyan-soft:rgba(45,212,191,.14);

  /* ---- 延迟色阶（0 最优 → 4 最差）---- */
  --lat0:#3fb950;
  --lat1:#7ee787;
  --lat2:#d29922;
  --lat3:#f0883e;
  --lat4:#f85149;

  /* ---- AGH StatsCard 四色（沿用，保持兼容）---- */
  --stats-card--queries:#3fb950;
  --stats-card--ads:#f0883e;
  --stats-card--threats:#d29922;
  --stats-card--adult:#a371f7;

  --alert-color:#c9d1d9;
  --alert-border:rgba(88,166,255,.35);
  --alert-bg:rgba(88,166,255,.10);

  --shadow-1:0 1px 2px rgba(0,0,0,.5);
  --shadow-2:0 14px 34px -18px rgba(0,0,0,.9);
  --radius:8px;
  --radius-sm:6px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
}

/* ---- 浅色 ---- */
html.theme-light{
  --bgcolor:#f6f8fa;
  --bgcolor-2:#eef1f5;
  --mcolor:#1f2328;
  --scolor:#656d76;
  --border-color:rgba(27,31,36,.10);
  --card-border-color:rgba(27,31,36,.13);
  --card-1:rgba(255,255,255,.96);
  --card-2:rgba(251,252,254,.92);
  --card-head:rgba(27,31,36,.025);
  --ctrl-bg:#ffffff;
  --ctrl-border:rgba(27,31,36,.16);
  --hover:rgba(27,31,36,.05);
  --glass-bg:rgba(255,255,255,.74);
  --glass-edge:rgba(255,255,255,.7);
  --accent:#0969da;
  --accent-soft:rgba(9,105,218,.10);
  --green:#1a7f37;
  --green-hover:#15682c;
  --green-soft:rgba(26,127,55,.10);
  --blue:#0969da;
  --blue-soft:rgba(9,105,218,.10);
  --red:#cf222e;
  --red-soft:rgba(207,34,46,.10);
  --amber:#9a6700;
  --amber-soft:rgba(154,103,0,.12);
  --purple:#8250df;
  --purple-soft:rgba(130,80,223,.10);
  --cyan:#0d9488;
  --cyan-soft:rgba(13,148,136,.10);
  --lat0:#1a7f37;--lat1:#2da44e;--lat2:#bf8700;--lat3:#bc4c00;--lat4:#cf222e;
  --stats-card--queries:#1a7f37;
  --stats-card--ads:#bc4c00;
  --stats-card--threats:#bf8700;
  --stats-card--adult:#8250df;
  --alert-color:#0a3069;
  --alert-border:#cbdbf2;
  --alert-bg:#dae5f5;
  --shadow-1:0 1px 2px rgba(16,24,40,.06);
  --shadow-2:0 12px 28px -20px rgba(16,24,40,.3);
}
@media (prefers-color-scheme:light){
  html:not(.theme-dark){
    --bgcolor:#f6f8fa;--bgcolor-2:#eef1f5;--mcolor:#1f2328;--scolor:#656d76;
    --border-color:rgba(27,31,36,.10);--card-border-color:rgba(27,31,36,.13);
    --card-1:rgba(255,255,255,.96);--card-2:rgba(251,252,254,.92);
    --card-head:rgba(27,31,36,.025);--ctrl-bg:#fff;--ctrl-border:rgba(27,31,36,.16);
    --hover:rgba(27,31,36,.05);--glass-bg:rgba(255,255,255,.74);--glass-edge:rgba(255,255,255,.7);
    --accent:#0969da;--accent-soft:rgba(9,105,218,.10);
    --green:#1a7f37;--green-hover:#15682c;--green-soft:rgba(26,127,55,.10);
    --blue:#0969da;--blue-soft:rgba(9,105,218,.10);
    --red:#cf222e;--red-soft:rgba(207,34,46,.10);
    --amber:#9a6700;--amber-soft:rgba(154,103,0,.12);
    --purple:#8250df;--purple-soft:rgba(130,80,223,.10);
    --cyan:#0d9488;--cyan-soft:rgba(13,148,136,.10);
    --lat0:#1a7f37;--lat1:#2da44e;--lat2:#bf8700;--lat3:#bc4c00;--lat4:#cf222e;
    --stats-card--queries:#1a7f37;--stats-card--ads:#bc4c00;
    --stats-card--threats:#bf8700;--stats-card--adult:#8250df;
    --alert-color:#0a3069;--alert-border:#cbdbf2;--alert-bg:#dae5f5;
    --shadow-1:0 1px 2px rgba(16,24,40,.06);--shadow-2:0 12px 28px -20px rgba(16,24,40,.3);
  }
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;padding:0;
  font-family:var(--font);font-size:14px;line-height:1.5;
  color:var(--mcolor);background:var(--bgcolor);
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
/* 静态背景光斑：给顶部玻璃提供可模糊的底，本身不含任何模糊滤镜 */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(760px 420px at 8% -12%,rgba(88,166,255,.16),transparent 62%),
    radial-gradient(700px 400px at 96% 0%,rgba(163,113,247,.13),transparent 64%),
    radial-gradient(680px 440px at 50% 112%,rgba(45,212,191,.10),transparent 62%);
}
html.theme-light body::before{
  background:
    radial-gradient(760px 420px at 8% -12%,rgba(9,105,218,.12),transparent 62%),
    radial-gradient(700px 400px at 96% 0%,rgba(130,80,223,.10),transparent 64%),
    radial-gradient(680px 440px at 50% 112%,rgba(13,148,136,.08),transparent 62%);
}
a{color:var(--accent);text-decoration:none}
.mono{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.tiny{font-size:11px;color:var(--scolor)}
.hide{display:none!important}

/* ================= 顶部玻璃 header ================= */
.header{
  position:sticky;top:0;z-index:60;
  background:var(--glass-bg);
  border-bottom:1px solid var(--card-border-color);
  box-shadow:var(--shadow-1);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(170%);
  backdrop-filter:blur(var(--glass-blur)) saturate(170%);
}
@supports not ((backdrop-filter:blur(2px)) or (-webkit-backdrop-filter:blur(2px))){
  .header{background:var(--bgcolor)}
}
.header__inner{
  max-width:1240px;margin:0 auto;padding:0 14px;
  display:flex;align-items:center;gap:10px;min-height:56px;
}
.brand{
  display:flex;align-items:center;gap:8px;flex:none;
  font-size:16px;font-weight:700;color:var(--mcolor);letter-spacing:.2px;
}
.brand svg{width:20px;height:20px;fill:var(--accent)}
.brand__sub{
  font-size:11px;font-weight:500;color:var(--scolor);
  padding:2px 7px;border:1px solid var(--card-border-color);border-radius:20px;
}
.nav-tabs{
  display:flex;align-items:stretch;gap:2px;
  margin-left:12px;flex:1 1 auto;min-width:0;
  /* 注意：这里绝不能设 overflow:auto/hidden —— 那会把下拉菜单裁掉。
     窄屏改为折行（flex-wrap），保证下拉永远可见。 */
  flex-wrap:wrap;overflow:visible;
}
.nav-item{position:relative;flex:none}
.nav-link{
  display:flex;align-items:center;gap:6px;
  padding:0 12px;height:56px;white-space:nowrap;cursor:pointer;
  font-size:13.5px;font-weight:500;color:var(--scolor);
  border-bottom:2px solid transparent;
  transition:color .15s,border-color .15s,background-color .15s;
}
.nav-link:hover{color:var(--mcolor);background:var(--hover)}
.nav-link.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.nav-link .caret{font-size:9px;opacity:.7}
.header__right{display:flex;align-items:center;gap:8px;flex:none}
.status-pill{
  font-size:11.5px;color:var(--scolor);max-width:250px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.status-pill .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--scolor);margin-right:5px;vertical-align:middle}
.status-pill .dot.on{background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.status-pill .dot.off{background:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
@media (max-width:640px){.status-pill{display:none}}
/* 窄屏收紧导航，尽量单行放下；放不下则折行，绝不裁切下拉 */
@media (max-width:520px){
  .header__inner{padding:0 8px;gap:6px}
  .brand__sub{display:none}
  .nav-tabs{margin-left:2px;gap:0}
  .nav-link{padding:0 8px;height:48px;font-size:12.5px}
}
/* 360dp 小屏再收一档，保证单行不溢出 */
@media (max-width:400px){
  .header__inner{padding:0 8px;gap:6px}
  .brand{gap:6px;font-size:15px}
  .brand svg{width:18px;height:18px}
  .nav-link{padding:0 6px;height:46px;font-size:12px}
  .nav-link .caret{font-size:8px}
  .icon-btn{width:30px;height:30px;font-size:14px}
}
.icon-btn{
  width:34px;height:34px;flex:none;padding:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;color:var(--mcolor);
  background:var(--ctrl-bg);border:1px solid var(--ctrl-border);border-radius:var(--radius-sm);
}
.icon-btn:hover{background:var(--hover)}
.icon-btn:active{transform:scale(.95)}

/* 下拉菜单：唯一允许使用 backdrop-filter 的浮层 */
.dropdown-menu{
  position:absolute;top:calc(100% - 1px);left:0;z-index:70;
  min-width:222px;max-width:calc(100vw - 24px);padding:5px;
  background:var(--glass-bg);
  border:1px solid var(--card-border-color);border-radius:var(--radius);
  box-shadow:var(--shadow-2);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  backdrop-filter:blur(20px) saturate(180%);
  display:none;
}
@supports not ((backdrop-filter:blur(2px)) or (-webkit-backdrop-filter:blur(2px))){
  .dropdown-menu{background:var(--bgcolor)}
}
.dropdown-menu.open{display:block}
/* 必须紧跟基础规则，否则会被后面的 min-width 覆盖掉 */
@media (max-width:520px){ .dropdown-menu{min-width:196px} }
.dropdown-item{
  display:block;padding:8px 10px;border-radius:6px;cursor:pointer;
  font-size:13px;color:var(--mcolor);white-space:nowrap;
}
.dropdown-item:hover{background:var(--hover)}
.dropdown-item.on{color:var(--accent);font-weight:600;background:var(--accent-soft)}

/* ================= 页面容器 ================= */
.container{max-width:1240px;margin:0 auto;padding:16px 14px 40px}
.page-title{
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
  flex-wrap:wrap;margin:2px 0 14px;
}
.page-title h2{margin:0;font-size:20px;font-weight:700;color:var(--mcolor);letter-spacing:-.2px}
.page-title__sub{font-size:12.5px;color:var(--scolor);margin-top:3px;font-family:var(--mono)}
.page-title__actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row{display:flex;flex-wrap:wrap;gap:14px;margin:0}
.col-12{flex:1 1 100%;min-width:0}
.col-6{flex:1 1 calc(50% - 7px);min-width:0}
.col-4{flex:1 1 calc(33.33% - 10px);min-width:0}
@media (max-width:900px){.col-4{flex:1 1 calc(50% - 7px)}}
@media (max-width:820px){.col-6,.col-4{flex:1 1 100%}}

/* ================= 卡片 ================= */
.card{
  background:linear-gradient(180deg,var(--card-1),var(--card-2));
  border:1px solid var(--card-border-color);border-radius:var(--radius);
  box-shadow:var(--shadow-1);
  margin-bottom:14px;overflow:hidden;
}
.row>.col-12>.card:last-child,.row>.col-6>.card:last-child,.row>.col-4>.card:last-child{margin-bottom:0}
.card-head{
  position:relative;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 14px 12px 16px;font-size:13.5px;font-weight:600;color:var(--mcolor);
  background:var(--card-head);
  border-bottom:1px solid var(--card-border-color);
}
/* 左侧强调轨：卡片标题的可视锚点 */
.card-head::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--accent);opacity:.75;
}
.card.accent-ok>.card-head::before{background:var(--green)}
.card.accent-warn>.card-head::before{background:var(--amber)}
.card.accent-err>.card-head::before{background:var(--red)}
.card.accent-alt>.card-head::before{background:var(--purple)}
.card-head .tagline{font-weight:400;font-size:11.5px;color:var(--scolor);text-align:right;font-family:var(--mono)}
.card>.hint:first-of-type{padding-top:12px}
.card>.hint{padding:0 14px}
.card>.kv{padding-left:14px;padding-right:14px}
.card>.kv:last-of-type{border-bottom:none}
.card>.btn-row{padding:0 14px}
.card>.list{padding:0 14px}
.card>input,.card>select,.card>.ta,.card>label{width:auto;margin-left:14px;margin-right:14px}
.card>input,.card>select{width:calc(100% - 28px)}
.card>.ta{width:calc(100% - 28px)}
.card>.list+.btn-row,.card>.list+.ta{margin-top:10px}
.card>*:last-child{margin-bottom:14px}

/* ================= 键值行 ================= */
.kv{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:9px 0;font-size:13px;border-bottom:1px solid var(--border-color);
}
.kv:last-child{border-bottom:none}
.kv span{color:var(--scolor);flex:none}
.kv b{font-weight:600;text-align:right;word-break:break-all;font-family:var(--mono);font-size:12.5px}
.kv .mono{color:var(--mcolor)}
.kv.tall{padding:11px 0}

/* ================= 指标磁贴 ================= */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:14px}
.grid.cols4{grid-template-columns:repeat(4,1fr);gap:10px}
.grid.cols3{grid-template-columns:repeat(3,1fr);gap:10px}
.grid.cols5{grid-template-columns:repeat(5,1fr);gap:10px}
@media (max-width:760px){.grid.cols4,.grid.cols5{grid-template-columns:repeat(2,1fr)}.grid.cols3{grid-template-columns:repeat(3,1fr)}}
@media (max-width:420px){.grid.cols3{grid-template-columns:repeat(2,1fr)}}
.metric{
  position:relative;overflow:hidden;
  padding:12px 13px;border-radius:var(--radius-sm);
  background:var(--ctrl-bg);
  border:1px solid var(--card-border-color);
  border-left:3px solid var(--stats-card--queries);
}
.metric .n{
  font-size:22px;font-weight:700;line-height:1.15;color:var(--mcolor);
  letter-spacing:-.5px;font-family:var(--mono);font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.metric .l{font-size:11.5px;color:var(--scolor);margin-top:4px}
.metric:nth-child(2){border-left-color:var(--stats-card--ads)}
.metric:nth-child(3){border-left-color:var(--stats-card--threats)}
.metric:nth-child(4){border-left-color:var(--stats-card--adult)}
.metric:nth-child(5){border-left-color:var(--cyan)}
.metric .sub{font-size:11px;color:var(--scolor);font-family:var(--mono);margin-top:2px}

/* ================= 按钮 ================= */
.btn{
  appearance:none;cursor:pointer;font-family:inherit;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 13px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;
  color:var(--mcolor);background:var(--ctrl-bg);
  border:1px solid var(--ctrl-border);
  transition:background-color .15s,border-color .15s,color .15s,transform .1s;
}
.btn:hover{background:var(--hover)}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ok{color:var(--green);border-color:var(--green);background:var(--green-soft)}
.btn.ok:hover{background:var(--green);color:#fff}
.btn.danger{color:var(--red);border-color:var(--red);background:var(--red-soft)}
.btn.danger:hover{background:var(--red);color:#fff}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:5px}
.btn.xs{padding:3px 8px;font-size:11.5px;border-radius:5px;font-weight:500}
.btn.ghost{background:transparent;border-color:transparent;color:var(--scolor)}
.btn.ghost:hover{background:var(--hover);color:var(--mcolor)}
.btn-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn-row .btn{min-width:0}

/* ================= 表单控件 ================= */
.ta,input[type=text],input[type=url],input[type=number],input[type=search],input[type=password],select{
  width:100%;margin-top:8px;padding:9px 11px;
  font-family:inherit;font-size:13px;color:var(--mcolor);
  background:var(--ctrl-bg);
  border:1px solid var(--ctrl-border);border-radius:var(--radius-sm);
  transition:border-color .15s,box-shadow .15s;
}
.ta:focus,input:focus,select:focus{
  outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft);
}
.ta{min-height:112px;resize:vertical;font-family:var(--mono);font-size:12px;line-height:1.6}
select{cursor:pointer}
input[type=checkbox]{accent-color:var(--accent)}
.hint{font-size:12px;color:var(--scolor);padding:10px 0 2px;line-height:1.6}
.hint b{color:var(--mcolor)}
.tagline{font-size:11.5px;color:var(--scolor)}

/* ================= 列表 / 表格行 ================= */
.list{display:block}
.list .row{
  display:flex;align-items:center;gap:10px;
  padding:9px 0;font-size:13px;
  border-bottom:1px solid var(--border-color);
}
.list .row:last-child{border-bottom:none}
.list .row:hover{background:var(--hover)}
.list .t{flex:1 1 auto;min-width:0;word-break:break-all}
.list .t .mono,.list .t .tagline{color:var(--scolor)}
.list.mono .row{font-family:var(--mono);font-size:11.5px}
.list .ln{padding:3px 0;font-family:var(--mono);font-size:11.5px;color:var(--scolor);word-break:break-all}
.empty{padding:22px 0;text-align:center;font-size:12.5px;color:var(--scolor)}
.del{
  flex:none;cursor:pointer;padding:3px 8px;border-radius:5px;
  font-size:12px;line-height:1.4;color:var(--red);
  background:transparent;border:1px solid transparent;
}
.del:hover{background:var(--red-soft);border-color:var(--red)}
.chk{
  display:inline-flex;align-items:center;gap:7px;cursor:pointer;
  font-size:12.5px;color:var(--mcolor);
  padding:5px 8px;border-radius:6px;border:1px solid transparent;
}
.chk:hover{background:var(--hover)}
.chk input{width:16px;height:16px;flex:none;cursor:pointer}
