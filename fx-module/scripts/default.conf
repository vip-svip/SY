# ---------- VPN / 代理（VPN 标签页） ----------
# vpn_mode: direct=直连(不接管) / rule=规则分流(CN直连+其余代理) / global=全局代理
vpn_mode=direct
# 断流保护: 代理不可达时阻断全部出网（防裸奔）
vpn_killswitch=0
# 规则模式下中国大陆 IP 直连（chnroute 分流）
vpn_cn_direct=1
# 局域网/保留网段直连
vpn_lan_direct=1
# IPv6 流量也走代理（ip6tables DNAT；关闭则 IPv6 全直连）
vpn_ipv6=0
# 无法代理的 UDP 流量直接阻断（防 QUIC/UDP 泄露绕过代理）
vpn_udp_block=0
# 分应用代理（按包名匹配 UID；模式见 [conf:vpn] app_mode）
vpn_app_proxy=0
# DNS 经代理远端解析（DNS 劫持到 [conf:vpn] remote_dns）
vpn_dns_hijack=0
# 订阅自动更新（间隔见 [conf:vpn] auto_update_h；service.sh 定时检查）
vpn_auto_update=0
# 当前选中节点（格式 proto:host:port，由 WebUI 选择或自动选优写入；空=未选）
vpn_node=
# 自动选优：订阅更新后自动测速全部节点，把当前节点切到延迟最低者（需 curl/nc）
vpn_auto_pick=0
# 隐藏 VPN/节点：对外(应用/系统检测)把代理出口完全伪装成本机直连——不让任何对端发现代理痕迹
#   1) shell 层：强制 DNS 全劫持(不经代理的域名也走远端解析)、QUIC/STUN/mDNS/SSDP 全断、
#      封锁 tun 痕迹端口(代理客户端本地监听)、IPv6 强制走代理或全断(防真实地址泄露)；
#   2) LSPosed 层：隐藏 tun/ppp/ipsec 网卡、ConnectivityManager TRANSPORT_VPN、
#      NetworkCapabilities NOT_VPN、VpnService 痕迹、/proc/net/tcp 代理端口连接。
#      对端(网站/服务)看到的本机 IP 即节点出口 IP，与"我就在节点所在地"一致
vpn_hide=0
# 内置代理核心：导入节点后自动下载并启动 sing-box（不装核心则本地端口无监听 → 无法接管）
#   1=开启：vpn_port_open 探测失败时自动启动（vpncore.sh：下载+生成配置+守护）
#   0=关闭：沿用用户自建核心（sing-box/Clash/mihomo 等，需自行监听 local_ip:local_port）
vpn_core=1
# 外部 VPN 叠加兼容（实验性）：1=允许 FX 的 OUTPUT 透明代理在外部隧道存在时继续运行。
# 外部 VPN 是否承载 sing-box/root 的上游连接，取决于第三方 VPN 的 UID/路由策略；需实测出口，默认关闭。
vpn_external_compat=1

# VPN 详细配置（配置面板 → 三级编辑）
[conf:vpn]
# 加密协议节点(vmess/vless/trojan/ss/hy2)经本地核心转发端口；socks/http 节点直连远端
local_ip=127.0.0.1
local_port=7890
# 远端 DNS（vpn_dns_hijack=1 时劫持 53 指向此；走代理域名用它解析）
remote_dns=1.1.1.1
# 国内直连域名解析 DNS
cn_dns=223.5.5.5
# 节点延迟测试 URL
test_url=http://www.gstatic.com/generate_204
# 订阅自动更新间隔（小时）
auto_update_h=24
# 中国大陆 IP 段表（vpn_cn_direct=1 时下载使用，纯 CIDR 文本每行一条）
chnroute_url=https://raw.githubusercontent.com/17mon/china_ip_list/master/china_ip_list.txt
# 分应用代理模式: only=仅列表内应用走代理 / bypass=列表内应用直连
app_mode=bypass
# 内置代理核心（vpn_core=1 时生效；sing-box，协议全覆盖 vmess/vless/trojan/ss/hy2/socks5）
# core_ver=sing-box 版本号；core_auto=1 时核心不存在则自动从 GitHub 下载对应架构
core_ver=1.14.3
core_auto=1
# 自定义核心可执行路径（留空=自动下载的 $PG/bin/sing-box；可指向用户自编译/自备核心）
core_bin=
# 客户端入站端口（mixed：HTTP/SOCKS，供浏览器/其它客户端显式指向）；
# 留空 = local_port+1（默认 7891）。注意 local_port 是 iptables REDIRECT 的 redirect 入站端口，
# 两者必须不同，否则 mixed 会与 redirect 抢同一端口导致核心启动失败。
mixed_port=
# 核心日志级别 trace/debug/info/warn/error/fatal/panic（默认 warn）。
# 排障时设 info 可看到 "inbound/redirect: inbound connection to host:port" 等逐连接证据。
log_level=warn
# 规则源缓存有效期（分钟）：命中缓存则不重下大清单（默认 120）。
# 「应用」按钮走 fast 模式本就不重下；0=每次全量都强制重下（刷新订阅时可临时设 0）。
hosts_cache_min=120
# 自动选优参数（vpn_auto_pick=1 时生效）
pick_min_ms=80
pick_test_timeout=5
pick_max_nodes=60
# 隐藏增强参数（vpn_hide=1 时生效；分级见 README「隐藏强度」）
# L0 基础：网卡/能力/VpnService/proc 痕迹（恒开）
# L1 默认：+DNS 全劫持、QUIC/STUN/mDNS/SSDP 全断、本地痕迹端口封锁、IPv6 强制全断、TCP 指纹规范化(timestamps=0)
# L2 增强：+ICMP 全禁、UDP 全禁(强制 TCP)、DoT/DoH(853) 禁、MTU/MSS clamp 1380(防节点 MTU 特征)
hide_level=1
hide_mtu_clamp=0
hide_udp_block_all=0
hide_icmp_block_all=0
hide_dot_block=0

[list:vpn_sub]
# 代理订阅（每行一个：订阅URL|订阅名|1启用）；订阅正文支持 ① Base64 订阅 ② 每行节点URI ③ Clash YAML(proxies:)
# 下方为完整示例，去掉行首 # 并换成你的真实订阅地址即可导入（example.com 为占位域名，不可用）
