# PrivacyGuard 默认配置（首次安装时复制到 /data/adb/privacyguard/settings.conf）
# 开关区（1=开启 0=关闭），键名与 WebUI 一一对应
lsposed_enabled=0
# Hook 档位（LSPosed 层）: compat=零破坏(默认；勾选普通 App 也不会改变其行为)
#   standard=仅隐藏 root 痕迹(会拦截 su/mount/getprop 等探测，部分 App 可能异常)
#   aggressive=全部破坏性 Hook(可能让被勾选 App 的功能异常/闪退)
#   优先级高于下面同名的逐键开关；custom=按逐键开关走(旧配置兼容)
lsposed_profile=compat
# 独立 LSPosed 应用内广告 Hook；默认关闭，需要 FX 目标列表与 LSPosed 作用域双重选择
hook_ads_enabled=0
# Independent per-app Android ID isolation Hook master switch; requires an enabled target with privacy=1 and matching LSPosed scope.
# Default off; this does not affect the separate ad Hook master switch.
hook_privacy_enabled=0
# Optional local DNS filter/cache + Unbound recursive resolver; off until explicitly enabled. No fixed Tencent/Alibaba/Cloudflare forwarder.
dns_engine_adguardhome=1
hook_block=0
ip_leak=1
dns_leak=1
vpn_leak=0
loc_leak=1
privacy_leak=1
app_info=1
app_list_upload=1
usage_upload=1
diag_upload=1
net_privacy=1
isp_snoop=1
# 系统联网检测域名保护：把 connectivitycheck / 门户探测域名从 hosts 黑名单里放行（默认开）
# 关掉它，系统会一直显示「已连接但无法访问互联网」，用户观感就是装完模块没网
hosts_keep=1
block_track_domains=1
geo_domains=1
custom_dns=0
# DNS 兜底转发（默认开）：拦截明文 DNS 时自动把它转到可信 DNS，避免「只封不转」导致整机没网
# 关掉后如果 dns_leak=1 且没有自定义 DNS，模块会 fail-open（不拦 DNS），不会再出现装完没网
dns_forward=1
block_quic=0
block_stun=0
block_dot=0
block_plain_dns=0
block_ipv6=0
block_multicast=0
transparent_proxy=0
# 已启用 HTTPS 脚本订阅自动刷新间隔（小时，1–168；默认 24）
script_auto_update_h=24
conn_guard=1
ad_id_unify=0
echo_blackhole=0
global_dns=0
dot_enforce=0
proxy_autoswitch=0
disable_tcp_timestamps=1
hide_tcp_fingerprint=1
