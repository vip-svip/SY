name: Build QuickJS-NG Android ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-qjs-arm64.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK r26b
        run: sdkmanager "ndk;26.1.10909125"

      - name: Fetch QuickJS-NG v0.17.0
        run: |
          git clone --depth 1 --branch v0.17.0 https://github.com/quickjs-ng/quickjs.git quickjs-ng
          test -f quickjs-ng/CMakeLists.txt

      - name: Configure Android ARM64 build
        run: |
          cmake -S quickjs-ng -B build-arm64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_SDK_ROOT/ndk/26.1.10909125/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install"

      - name: Build and install
        run: |
          cmake --build build-arm64 --parallel
          cmake --install build-arm64

      - name: Verify ARM64 ELF and smoke test
        run: |
          set -eu
          QJS="$(find build-arm64 install -type f -name qjs -perm -111 -print -quit)"
          test -n "$QJS"
          file "$QJS"
          readelf -h "$QJS" | grep -E 'Machine:.*AArch64'
          mkdir -p artifact
          cp "$QJS" artifact/qjs-android-arm64
          sha256sum artifact/qjs-android-arm64 | tee artifact/SHA256SUMS
          printf '%s\n' 'Built ARM64 qjs. Runtime execution requires Android/ARM64; ELF architecture verified in CI.' > artifact/BUILD-STATUS.txt

      - name: Upload qjs artifact
        uses: actions/upload-artifact@v4
        with:
          name: qjs-android-arm64
          path: artifact/
          if-no-files-found: error
          retention-days: 14
