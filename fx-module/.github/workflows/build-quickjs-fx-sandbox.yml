name: Build hardened QuickJS-NG for FX Android ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-quickjs-fx-sandbox.yml"

permissions:
  contents: read

jobs:
  build-android-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout pinned QuickJS-NG source
        uses: actions/checkout@v4
        with:
          repository: quickjs-ng/quickjs
          ref: v0.17.0
          path: quickjs
          persist-credentials: false

      - name: Apply FX import boundary hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("quickjs")

          def sub_once(rel, pattern, repl, flags=0):
              p = root / rel
              source = p.read_text()
              updated, count = re.subn(pattern, repl, source, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{rel}: expected one patch anchor, found {count}: {pattern}")
              p.write_text(updated)

          # Public API declaration: anchor on the adjacent normalizer comment to
          # avoid depending on whitespace in the upstream function prototype.
          sub_once("quickjs.h",
              r"(?m)^/\* Set an attributes-aware module normalizer\. Call after JS_SetModuleLoaderFunc2\. \*/$",
              "/* FX: disable privileged/native module imports after trusted host initialization. */\nJS_EXTERN void JS_SetModuleImportSandbox(JSRuntime *rt, bool enabled);\n\n/* Set an attributes-aware module normalizer. Call after JS_SetModuleLoaderFunc2. */")

          sub_once("quickjs.c",
              r"(?m)^([ \t]*)JSModuleCheckSupportedImportAttributes \*module_check_attrs;\n\1void \*module_loader_opaque;\n",
              lambda m: m.group(0) + m.group(1) + "bool disable_privileged_module_imports; /* FX script sandbox */\n")

          sub_once("quickjs.c",
              r"(?m)^int JS_SetModulePrivateValue\(JSContext \*ctx, JSModuleDef \*m, JSValue val\)$",
              "void JS_SetModuleImportSandbox(JSRuntime *rt, bool enabled)\n{\n    if (rt)\n        rt->disable_privileged_module_imports = enabled;\n}\n\nint JS_SetModulePrivateValue(JSContext *ctx, JSModuleDef *m, JSValue val)")

          # This guard is deliberately before loaded-module cache lookup, because
          # --std preloads the native modules for the trusted host prelude.
          sub_once("quickjs.c",
              r"(?m)^([ \t]*)module_name = JS_NewAtom\(ctx, cname\);$",
              r"""\1if (rt->disable_privileged_module_imports) {
          \1    const char *suffix = strrchr(cname, '.');
          \1    bool native_module = suffix && !strcmp(suffix, ".so");
          \1    bool privileged_module = !strcmp(cname, "qjs:std") ||
          \1                             !strcmp(cname, "qjs:os") ||
          \1                             !strcmp(cname, "qjs:bjson") ||
          \1                             !strcmp(cname, "std") ||
          \1                             !strcmp(cname, "os") ||
          \1                             !strcmp(cname, "bjson");
          \1    if (native_module || privileged_module) {
          \1        JS_ThrowReferenceError(ctx, "privileged/native module import disabled by FX: %s", cname);
          \1        js_free(ctx, cname);
          \1        return NULL;
          \1    }
          \1}
          \1module_name = JS_NewAtom(ctx, cname);""")

          qjs = root / "qjs.c"
          s = qjs.read_text()
          loop = s.index("for(i = 0; i < include_count; i++) {")
          target = s.index("if (standalone) {", loop)
          line_start = s.rfind("\n", 0, target) + 1
          guard = ("        /* The trusted host prelude captured private std/os references. */\n"
                   "        /* Restrict user scripts after includes; cache hits are also blocked. */\n"
                   "        if (load_std)\n"
                   "            JS_SetModuleImportSandbox(rt, true);\n\n")
          qjs.write_text(s[:line_start] + guard + s[line_start:])
          print("FX QuickJS module import boundary patches applied")
          PY

      - name: Install Android NDK r26b
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned NDK
        run: sdkmanager "ndk;26.1.10909125"

      - name: Build hardened host test binary
        run: |
          set -euo pipefail
          cmake -S quickjs -B build-host -DCMAKE_BUILD_TYPE=Release -DQJS_BUILD_LIBC=ON -DQJS_BUILD_EXAMPLES=OFF
          cmake --build build-host --target qjs_exe -j2
          cat > host-prelude.js <<'EOF'
          const _fxSmokeStd = std;
          globalThis.std = undefined;
          globalThis.os = undefined;
          globalThis.bjson = undefined;
          globalThis.__fxSmokeFinish = function(ok, message) {
            if (!ok) {
              console.error('SECURITY FAILURE: ' + message);
              _fxSmokeStd.exit(1);
            }
            console.log('FX module import boundary smoke: PASS');
            _fxSmokeStd.exit(0);
          };
          EOF
          cat > sandbox-smoke.js <<'EOF'
          const cases = [
            ['qjs:os', e => String(e).includes('disabled by FX')],
            ['qjs:std', e => String(e).includes('disabled by FX')],
            ['qjs:bjson', e => String(e).includes('disabled by FX')],
            ['/system/lib64/libc.so', e => String(e).includes('disabled by FX')],
            ['std', e => String(e).includes('disabled by FX')],
            ['os', e => String(e).includes('disabled by FX')],
            ['bjson', e => String(e).includes('disabled by FX')]
          ];
          Promise.all(cases.map(([name, expected]) =>
            import(name).then(() => ({name, ok:false}), e => ({name, ok:expected(e)}))
          )).then(results => {
            const bad = results.find(r => !r.ok);
            globalThis.__fxSmokeFinish(!bad, bad ? bad.name + ' import was not blocked' : '');
          }).catch(e => globalThis.__fxSmokeFinish(false, String(e)));
          EOF
          build-host/qjs --std -C -I host-prelude.js sandbox-smoke.js
          sha256sum build-host/qjs

      - name: Cross-compile Android ARM64 binary
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_SDK_ROOT/ndk/26.1.10909125"
          cmake -S quickjs -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DQJS_BUILD_LIBC=ON \
            -DQJS_BUILD_EXAMPLES=OFF
          cmake --build build-android --target qjs_exe -j2
          mkdir -p artifact
          install -m 0755 build-android/qjs artifact/qjs
          file artifact/qjs | tee artifact/FILE.txt
          readelf -h artifact/qjs | grep -E 'Machine:.*AArch64'
          readelf -lW artifact/qjs | grep -F '/system/bin/linker64'
          printf '%s\n' 'QuickJS-NG v0.17.0; Android arm64-v8a; NDK r26b; API 24' > artifact/BUILD-INFO.txt
          printf '%s\n' 'Hardened: qjs:std/qjs:os/qjs:bjson and native .so imports blocked after trusted host initialization.' >> artifact/BUILD-INFO.txt
          printf '%s\n' 'This checks build target and host sandbox behavior, not OnePlus 12 runtime operation.' >> artifact/BUILD-INFO.txt
          (cd artifact && sha256sum qjs > SHA256SUMS)

      - name: Upload hardened Android runtime
        uses: actions/upload-artifact@v4
        with:
          name: fx-quickjs-ng-android-arm64-sandbox-v0.17.0
          path: artifact/
          if-no-files-found: error
          retention-days: 14
