http:
  address: 127.0.0.1:0
  session_ttl: 3h
  pprof:
    enabled: false
    port: 6060
  doh:
    routes:
    - GET /dns-query
    - POST /dns-query
    - GET /dns-query/{ClientID}
    - POST /dns-query/{ClientID}
    insecure_enabled: false
users:
- name: fx-local
  password: "$2a$12$2.x1ZQ78RvLwzP0MzwMUPuVOW5e2BHAsdmf8.Z1jaqNc2ZmPDR1z2"
dns:
  bind_hosts:
  - 127.0.0.1
  - ::1
  port: 53
  # Privacy baseline: mask client addresses and reject DNS server fingerprint probes.
  anonymize_client_ip: true
  refuse_any: true
  blocked_hosts:
  - version.bind
  - id.server
  - hostname.bind
  # All cache misses go to the device-local Unbound recursive resolver.
  # Unbound queries root/TLD/authoritative servers directly, with no fixed
  # No external forwarding resolver is configured here.
  upstream_dns:
  - 127.0.0.1:5353
  fallback_dns: []
  cache_enabled: true
  cache_size: 4194304
  cache_ttl_min: 0
  cache_ttl_max: 0
  cache_optimistic: false
  cache_optimistic_answer_ttl: 30s
  cache_optimistic_max_age: 12h
  enable_dnssec: true
  upstream_mode: load_balance
  fastest_timeout: 1s
  upstream_timeout: 10s
  hostsfile_enabled: false
filtering:
  protection_enabled: true
  filtering_enabled: true
  blocking_mode: nxdomain
  blocked_response_ttl: 10
  safe_fs_patterns: []
  rewrites: []
  safe_search:
    enabled: false
    bing: false
    duckduckgo: false
    ecosia: false
    google: false
    pixabay: false
    yandex: false
    youtube: false
  blocked_services:
    schedule:
      time_zone: Local
    ids: []
filters: []
user_rules:
  - "||gjfzpt.cn^"
  - "||fzapp-test-tyy.gjfzpt.cn^"
  - "||oss.gjfzpt.cn^"
  - "||fzapp.gjfzpt.cn^"
  - "||fzapph5.gjfzpt.cn^"
querylog:
  enabled: false
  file_enabled: false
  interval: 30d
  size_memory: 1000
  ignored: []
  ignored_enabled: false
statistics:
  enabled: false
  interval: 10d
  ignored: []
  ignored_enabled: false
schema_version: 34
tls:
  enabled: false
