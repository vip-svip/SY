// PrivacyGuard LSPosed Hook 模块
plugins {
    id 'com.android.application'
}

android {
    namespace 'de.privacyguard.hook'
    compileSdk 34

    defaultConfig {
        applicationId 'de.privacyguard.hook'
        minSdk 27
        targetSdk 34
        versionCode 19
        versionName '1.8.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
