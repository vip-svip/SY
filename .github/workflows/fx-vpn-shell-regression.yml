name: FX VPN shell regression

on:
  push:
    branches:
      - fx-v1.0.0-unified-hook-integration
    paths:
      - "fx-module/scripts/yulong-root-proxy.sh"
      - "fx-module/scripts/vpn-external-watchdog.sh"
      - "fx-module/service.sh"
      - "fx-module/uninstall.sh"
      - "scripts/tests/fx-vpn-external-watchdog-regression.sh"
      - "scripts/tests/fx-yulong-root-proxy-runtime-regression.sh"
      - "scripts/tests/fx-root-proxy-uninstall-order-regression.sh"
      - "fx-module/scripts/vpn-external-watchdog.sh"
      - "fx-module/service.sh"
      - "fx-module/uninstall.sh"
      - "scripts/tests/fx-vpn-external-watchdog-regression.sh"
      - ".github/workflows/fx-vpn-shell-regression.yml"
  pull_request:
    branches:
      - fx-v1.0.0-unified-hook-integration
    paths:
      - "fx-module/scripts/yulong-root-proxy.sh"
      - "fx-module/scripts/vpn-external-watchdog.sh"
      - "fx-module/service.sh"
      - "fx-module/uninstall.sh"
      - "scripts/tests/fx-vpn-external-watchdog-regression.sh"
      - "scripts/tests/fx-yulong-root-proxy-runtime-regression.sh"
      - "scripts/tests/fx-root-proxy-uninstall-order-regression.sh"
      - "fx-module/scripts/vpn-external-watchdog.sh"
      - "fx-module/service.sh"
      - "fx-module/uninstall.sh"
      - "scripts/tests/fx-vpn-external-watchdog-regression.sh"
      - ".github/workflows/fx-vpn-shell-regression.yml"

permissions:
  contents: read

concurrency:
  group: fx-vpn-shell-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root-proxy:
    name: Root Proxy runtime regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Validate POSIX shell syntax
        run: |
          set -eu
          sh -n fx-module/scripts/yulong-root-proxy.sh
          sh -n fx-module/scripts/vpn-external-watchdog.sh
          sh -n fx-module/service.sh
          sh -n fx-module/uninstall.sh
          sh -n scripts/tests/fx-yulong-root-proxy-runtime-regression.sh
          sh -n scripts/tests/fx-root-proxy-uninstall-order-regression.sh
          sh -n scripts/tests/fx-vpn-external-watchdog-regression.sh
      - name: Run Root Proxy runtime regression
        run: sh scripts/tests/fx-yulong-root-proxy-runtime-regression.sh
      - name: Verify Root Proxy uninstall ordering
        run: sh scripts/tests/fx-root-proxy-uninstall-order-regression.sh
      - name: Verify external VPN watchdog lifecycle
        run: sh scripts/tests/fx-vpn-external-watchdog-regression.sh
