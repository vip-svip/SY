name: FX GKD-XA Selector Compatibility

on:
  push:
    branches:
      - fx-v1.0.0-unified-hook-integration
    paths:
      - '.github/workflows/fx-gkd-selector.yml'
      - '.gitmodules'
      - 'vendor/GKD-XA'
      - 'adhook/build.gradle'
      - 'adhook/settings.gradle'
      - 'adhook/fx-gkd-selector/**'
      - 'adhook/app/build.gradle'
      - 'adhook/app/src/main/java/de/privacyguard/adhook/FxGkdSelectorRuntime.kt'
      - 'adhook/app/src/test/java/de/privacyguard/adhook/FxGkdSelectorRuntimeTest.kt'
  pull_request:
    branches:
      - fx-v1.0.0-unified-hook-integration
    paths:
      - '.github/workflows/fx-gkd-selector.yml'
      - '.gitmodules'
      - 'vendor/GKD-XA'
      - 'adhook/build.gradle'
      - 'adhook/settings.gradle'
      - 'adhook/fx-gkd-selector/**'
      - 'adhook/app/build.gradle'
      - 'adhook/app/src/main/java/de/privacyguard/adhook/FxGkdSelectorRuntime.kt'
      - 'adhook/app/src/test/java/de/privacyguard/adhook/FxGkdSelectorRuntimeTest.kt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fx-gkd-selector-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selector-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FX and pinned GKD-XA source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Verify pinned selector source
        shell: bash
        run: |
          set -euo pipefail
          test -s vendor/GKD-XA/gkd-selector/src/commonMain/kotlin/li/gkd/selector/Selector.kt
          test -s vendor/GKD-XA/gkd-selector/src/jvmMain/kotlin/li/gkd/selector/property/RegexCompiler.jvm.kt
          git -C vendor/GKD-XA rev-parse HEAD | grep -Fx '8a6ce935da11671dac7e1a7595416ec99ee07436'
          grep -Fq 'GNU GENERAL PUBLIC LICENSE' vendor/GKD-XA/LICENSE
      - name: Compile and run upstream selector contract tests
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p adhook :fx-gkd-selector:jvmTest
