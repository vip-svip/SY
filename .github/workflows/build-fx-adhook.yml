name: Build FX Hook LSPosed APK

on:
  push:
    branches: [fx-hook-audit160, fx-v1.0.0-unified-hook-integration]
    paths:
      - "adhook/**"
      - ".github/workflows/build-fx-adhook.yml"
      - "scripts/install_adhook_app.sh"
      - "fx-module/scripts/install_adhook_app.sh"
      - "scripts/remove_adhook_app.sh"
      - "fx-module/scripts/install_adhook_app.sh"
      - "scripts/tests/**"
  pull_request:
    branches: [main]
    paths:
      - "adhook/**"
      - ".github/workflows/build-fx-adhook.yml"
      - "scripts/install_adhook_app.sh"
      - "scripts/remove_adhook_app.sh"
      - "fx-module/scripts/install_adhook_app.sh"
      - "scripts/tests/adhook-app-installer-regression.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: ${{ vars.FX_FULL_APP_MIGRATION_COMPLETE == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Install SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f 2>/dev/null | sort | tail -n1)"
          else
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-34" "build-tools;34.0.0"
      - name: Stage complete FX WebUI inside the APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fx-release" adhook/app/src/main/assets/webroot
          gh release download 1.0.0 --repo vip-svip/SY --pattern 'FX-v1.0.0.zip' --dir "$RUNNER_TEMP/fx-release"
          unzip -p "$RUNNER_TEMP/fx-release/FX-v1.0.0.zip" webroot/index.html > adhook/app/src/main/assets/webroot/index.html
          test "$(wc -c < adhook/app/src/main/assets/webroot/index.html)" -gt 500000
          for page in pageVpn pageAd pageHosts pagePrivacy pageScript pageMore; do
            grep -q "id=\"$page\"" adhook/app/src/main/assets/webroot/index.html
          done
          sha256sum adhook/app/src/main/assets/webroot/index.html
      - name: Validate modern API, secure config transport, and read-only diagnostics
        shell: bash
        run: |
          PARSER_SRC=adhook/app/src/main/java/de/privacyguard/adhook/UnifiedHookConfigParser.java
          test -s "$PARSER_SRC"
          test -s adhook/app/src/test/java/de/privacyguard/adhook/HookTargetConfigParserTest.java
          test -s adhook/app/src/test/java/de/privacyguard/adhook/UnifiedHookConfigParserTest.java
          grep -q 'UnifiedHookConfigParser.parse' "adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java"
          grep -q 'installExifStripHooks' "adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java"
          grep -q 'isExifStripEnabledFor' "$PARSER_SRC"
          grep -q 'exif_strip' adhook/app/src/main/java/de/privacyguard/adhook/UnifiedHookConfigSerializer.java
          grep -q 'shouldRedactTag' adhook/app/src/main/java/de/privacyguard/adhook/ExifPrivacyPolicy.java
          grep -q 'parsesOptInExifPrivacyFeatureIndependently' adhook/app/src/test/java/de/privacyguard/adhook/UnifiedHookConfigParserTest.java
          grep -q 'serializerRoundTripsExifRedactionIndependently' adhook/app/src/test/java/de/privacyguard/adhook/UnifiedHookConfigSerializerTest.java
          grep -q 'redactsGpsCoordinatesAndGpsMetadata' adhook/app/src/test/java/de/privacyguard/adhook/ExifPrivacyPolicyTest.java
          grep -q 'getLatLong' "adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java"
          grep -q 'getAltitude' "adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java"
          grep -q 'directCoordinateAccessorsAreRedacted' adhook/app/src/test/java/de/privacyguard/adhook/ExifPrivacyPolicyTest.java
          grep -q 'installClipboardReadBlockHooks' "adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java"
          grep -q 'clipboard_read_block' "$PARSER_SRC"
          grep -q 'clipboard_isolate_enabled' "$PARSER_SRC"
          grep -q 'clipboard_isolate' "$PARSER_SRC"
          grep -q 'installClipboardIsolationHooks' "adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java"
          grep -q 'clipboard_isolate_enabled' adhook/app/src/main/java/de/privacyguard/adhook/UnifiedHookConfigSerializer.java
          grep -q 'parsesClipboardIsolationAsIndependentPrivacyFeature' adhook/app/src/test/java/de/privacyguard/adhook/UnifiedHookConfigParserTest.java
          grep -q 'serializerRoundTripsClipboardIsolationMasterAndTarget' adhook/app/src/test/java/de/privacyguard/adhook/UnifiedHookConfigSerializerTest.java
          grep -q 'ClipboardPrivacyPolicy.shouldBlockRead' "adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java"
          grep -q 'sharedPackageProcessFailsOpen' adhook/app/src/test/java/de/privacyguard/adhook/ClipboardPrivacyPolicyTest.java
          grep -q 'remote config rejected; no hooks enabled' "adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java"
          test -f adhook/app/src/main/resources/META-INF/xposed/java_init.list
          test -f adhook/app/src/main/resources/META-INF/xposed/module.prop
          test -f adhook/app/src/main/resources/META-INF/xposed/scope.list
          grep -q 'io.github.libxposed' adhook/app/build.gradle
          grep -q 'minApiVersion=101' adhook/app/src/main/resources/META-INF/xposed/module.prop
          grep -q 'staticScope=false' adhook/app/src/main/resources/META-INF/xposed/module.prop
          grep -q 'openRemoteFile' "adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java"
          grep -q 'AutoCloseInputStream' "adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java"
          grep -q 'remote config exceeds 64 KiB' "adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java"
          grep -q 'bytes.size() + count > 65536' "adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java"
          grep -q 'CodingErrorAction.REPORT' "adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java"
          grep -q 'PROP_CAP_REMOTE' "adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java"
          grep -q 'Dialog.class' "adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java"
          grep -q 'PopupWindow.class' "adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java"
          grep -q 'installDynamicAdChildHooks' "adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java"
          grep -q 'scheduleAddedViewCheck' "adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java"
          grep -q 'dynamic ad child observers installed' "adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java"
          grep -q 'billing responseCode' "adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java"
          grep -q 'billing purchaseState' "adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java"
          grep -q 'concrete billing value diagnostics installed=' "adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java"
          grep -q 'Never log product IDs' "adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java"
          grep -q 'versionCode 10000' adhook/app/build.gradle
          grep -q 'com.huawei.hms.ads' "adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java"
          grep -q 'com.miui.zeus.mimo.sdk' "adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java"
          grep -q 'com.heytap.msp.mobad.api' "adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java"
          ! grep -q '/data/local/tmp/privacyguard/xposed.conf' "adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java"
          ! grep -Eq 'setResult[(]|setPurchaseState|purchaseToken.*=' "adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java"
          ! test -f adhook/app/src/main/assets/xposed_init
          test -s scripts/install_adhook_app.sh
          test -s scripts/remove_adhook_app.sh
          grep -q 'pm install -r' scripts/install_adhook_app.sh
          ! grep -Eqi 'iptables|ip6tables|dns_hijack|vpn_mode|setprop net\.' scripts/install_adhook_app.sh scripts/remove_adhook_app.sh
      - name: Run parser and deployment regression tests, then build APK
        run: |
          sh scripts/tests/fx-app-webui-migration-regression.sh\n          JAVA_SRC=adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java
          sh scripts/tests/adhook-app-installer-regression.sh
          sh scripts/tests/v1.0.0-lsposed-audiorecord-mic-silence-regression.sh .
          grep -q 'exif_strip' adhook/app/src/main/java/de/privacyguard/adhook/UnifiedHookConfigParser.java
          grep -q 'notification_permission_hide_enabled' adhook/app/src/main/java/de/privacyguard/adhook/UnifiedHookConfigParser.java
          grep -q 'notification_permission_hide' adhook/app/src/main/java/de/privacyguard/adhook/UnifiedHookConfigSerializer.java
          grep -q 'mic_silence' adhook/app/src/main/java/de/privacyguard/adhook/UnifiedHookConfigParser.java
          grep -q 'installAudioRecordSilenceHooks' adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java
          grep -q 'installCameraAccessBlockHooks' adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java
          grep -q 'ExceptionMode.PASSTHROUGH' adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java
          grep -q 'installLocationAccessBlockHooks' adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java
          grep -q 'installMicrophoneAccessBlockHooks' adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java
          grep -q 'installMediaStoreQueryBlockHooks' adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java
          grep -q 'media_store_query_block' adhook/app/src/main/java/de/privacyguard/adhook/UnifiedHookConfigParser.java
          grep -q 'media_store_query_block' adhook/app/src/main/java/de/privacyguard/adhook/UnifiedHookConfigSerializer.java
          grep -q 'parsesExplicitMediaStoreQueryBlockPerTarget' adhook/app/src/test/java/de/privacyguard/adhook/UnifiedHookConfigParserTest.java
          grep -q 'serializerRoundTripsExplicitMediaStoreQueryBlock' adhook/app/src/test/java/de/privacyguard/adhook/UnifiedHookConfigSerializerTest.java
          grep -q 'MediaRecorder.class.getDeclaredMethods' adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java
          grep -q 'mic_access_block' adhook/app/src/main/java/de/privacyguard/adhook/UnifiedHookConfigParser.java
          grep -q 'mic_access_block' adhook/app/src/main/java/de/privacyguard/adhook/UnifiedHookConfigSerializer.java
          grep -q 'parsesExplicitMicrophoneAccessDenialPerTarget' adhook/app/src/test/java/de/privacyguard/adhook/UnifiedHookConfigParserTest.java
          grep -q 'serializerRoundTripsExplicitMicrophoneAccessDenial' adhook/app/src/test/java/de/privacyguard/adhook/UnifiedHookConfigSerializerTest.java
          grep -q 'location_access_block' adhook/app/src/main/java/de/privacyguard/adhook/UnifiedHookConfigParser.java
          grep -q 'location_access_block' adhook/app/src/main/java/de/privacyguard/adhook/UnifiedHookConfigSerializer.java
          grep -q 'parsesExplicitLocationAccessDenialPerTarget' adhook/app/src/test/java/de/privacyguard/adhook/UnifiedHookConfigParserTest.java
          grep -q 'serializerRoundTripsExplicitLocationAccessDenial' adhook/app/src/test/java/de/privacyguard/adhook/UnifiedHookConfigSerializerTest.java
          grep -q 'camera_access_block' adhook/app/src/main/java/de/privacyguard/adhook/UnifiedHookConfigParser.java
          grep -q 'camera_access_block' adhook/app/src/main/java/de/privacyguard/adhook/UnifiedHookConfigSerializer.java
          grep -q 'parsesExplicitCameraAccessDenialPerTarget' adhook/app/src/test/java/de/privacyguard/adhook/UnifiedHookConfigParserTest.java
          grep -q 'serializerRoundTripsExplicitCameraAccessDenial' adhook/app/src/test/java/de/privacyguard/adhook/UnifiedHookConfigSerializerTest.java
          grep -q 'AudioRecordSilencePolicy.zero' adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java
          grep -q 'installNotificationPermissionPrivacyHooks' "adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java"
          grep -q 'areNotificationsEnabled' "adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java"
          grep -q 'NotificationPrivacyPolicy.shouldHidePermission' "adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java"
          grep -q 'shouldHidePermission' adhook/app/src/main/java/de/privacyguard/adhook/NotificationPrivacyPolicy.java
          grep -q 'hidesOnlyExplicitNotificationPermissionQueryTarget' adhook/app/src/test/java/de/privacyguard/adhook/NotificationPrivacyPolicyTest.java
          grep -q 'notificationPermissionQueryFailsOpenWhenMasterOffSharedOrProtected' adhook/app/src/test/java/de/privacyguard/adhook/NotificationPrivacyPolicyTest.java
          gradle --no-daemon -p adhook :app:testDebugUnitTest :app:assembleDebug
      - name: Verify APK is signed and has modern Xposed resources
        shell: bash
        run: |
          APK=adhook/app/build/outputs/apk/debug/app-debug.apk
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -s "$APK"
          "$SDK_ROOT/build-tools/34.0.0/apksigner" verify "$APK"
          sha256sum "$APK"
          unzip -l "$APK" | grep -q 'META-INF/xposed/java_init.list'
          unzip -l "$APK" | grep -q 'META-INF/xposed/module.prop'
          unzip -p "$APK" assets/xposed_init 2>/dev/null && exit 1 || true
      - name: Verify bounded member and rewarded-flow diagnostics in compiled DEX
        shell: bash
        run: |
          set -euo pipefail
          APK=adhook/app/build/outputs/apk/debug/app-debug.apk
          DEXSTR=$(for dex in $(unzip -Z1 "$APK" | grep -E '^classes([0-9]+)?[.]dex$'); do unzip -p "$APK" "$dex" 2>/dev/null | strings || true; done)
          for token in "startBoundedMemberDexScan" "splitSourceDirs" "apkFilesScanned" "inspectDynamicallyLoadedMemberClass" "MAX_AUTO_MEMBER_METHOD_HOOKS" "MAX_DYNAMIC_MEMBER_CLASSES" "MEMBER_STATE_FIELD_MARKERS" "hasMemberStateField" "hasMemberStateType" "observeLoadedMemberClass" "installReadOnlyMemberCandidateHook" "member DEX candidate scan finished" "billing purchaseAcknowledged" "billing purchaseAutoRenewing" "billing clientReady" "recordRewardedAdEvidence" "preserve-reward-flow" "action=observe-only;"; do
            if [[ "$DEXSTR" != *"$token"* ]]; then echo "::error::Compiled DEX missing expected marker: $token"; exit 1; fi
          done
          JAVA_SRC=adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java
          for token in "领取金币" "看视频领" "看广告领" "激励视频" "广告奖励"; do
            grep -Fq "$token" "adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java" || { echo "::error::Source missing rewarded UI evidence marker: $token"; exit 1; }
          done
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FX-Hook-apk
          path: adhook/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload matching Hook source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: FX-Hook-source
          path: |
            adhook/
            scripts/install_adhook_app.sh
            scripts/remove_adhook_app.sh
          if-no-files-found: error
