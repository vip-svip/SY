name: Build FXAdHook LSPosed APK

on:
  push:
    branches: [fx-hook-audit160]
    paths:
      - "adhook/**"
      - ".github/workflows/build-fx-adhook.yml"
  pull_request:
    branches: [main]
    paths:
      - "adhook/**"
      - ".github/workflows/build-fx-adhook.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Install SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f 2>/dev/null | sort | tail -n1)"
          else
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-34" "build-tools;34.0.0"
      - name: Validate scope and read-only billing diagnostics
        run: |
          test -f adhook/app/src/main/assets/xposed_init
          grep -q 'hook_ads_enabled' adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java
          grep -q 'member diagnostic' adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java
          ! grep -Eq 'param\\.setResult|setResult\\(' adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java
      - name: Build APK
        run: gradle --no-daemon -p adhook :app:assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FXAdHook-apk
          path: adhook/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
