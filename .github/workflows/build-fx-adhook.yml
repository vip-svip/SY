      - name: Run complete FX host regression suite (no compile)
        shell: bash
        run: |
          set -euo pipefail
          # The restored Release archive may carry an older installer regression.
          # Re-sync the reviewed canonical scripts immediately before executing the
          # module-wide suite, and assert byte-for-byte identity to avoid stale copies.
          install -D -m 0755 scripts/install_adhook_app.sh fx-module/scripts/install_adhook_app.sh
          install -D -m 0755 scripts/remove_adhook_app.sh fx-module/scripts/remove_adhook_app.sh
          install -D -m 0755 scripts/tests/adhook-app-installer-regression.sh fx-module/scripts/tests/adhook-app-installer-regression.sh
          install -D -m 0755 scripts/yulong-stellar-control.sh fx-module/scripts/yulong-stellar-control.sh
          install -D -m 0755 scripts/tests/v1.0.0-fxhook-adid-unify-regression.sh fx-module/scripts/tests/v1.0.0-fxhook-adid-unify-regression.sh
          install -D -m 0755 scripts/tests/fx-stellar-control-shell-regression.sh fx-module/scripts/tests/fx-stellar-control-shell-regression.sh
          install -D -m 0755 scripts/tests/v1.0.0-subfetch-concurrency-regression.sh fx-module/scripts/tests/v1.0.0-subfetch-concurrency-regression.sh
          cmp -s scripts/install_adhook_app.sh fx-module/scripts/install_adhook_app.sh
          cmp -s scripts/remove_adhook_app.sh fx-module/scripts/remove_adhook_app.sh
          cmp -s scripts/tests/adhook-app-installer-regression.sh fx-module/scripts/tests/adhook-app-installer-regression.sh
          cmp -s scripts/yulong-stellar-control.sh fx-module/scripts/yulong-stellar-control.sh
          cmp -s scripts/tests/v1.0.0-fxhook-adid-unify-regression.sh fx-module/scripts/tests/v1.0.0-fxhook-adid-unify-regression.sh
          cmp -s scripts/tests/fx-stellar-control-shell-regression.sh fx-module/scripts/tests/fx-stellar-control-shell-regression.sh
          cmp -s scripts/tests/v1.0.0-subfetch-concurrency-regression.sh fx-module/scripts/tests/v1.0.0-subfetch-concurrency-regression.sh
          sh fx-module/scripts/tests/fx-stellar-control-shell-regression.sh
          sh fx-module/scripts/tests/adhook-app-installer-regression.sh
          set -uo pipefail
          mapfile -t tests < <(find fx-module/scripts/tests -maxdepth 1 -type f -name '*.sh' | sort)
          test "${#tests[@]}" -ge 250 || { echo "::error::Expected the complete FX regression suite; found only ${#tests[@]} scripts."; exit 1; }
          # Assert all six build-artifact checks exist before counting them as
          # intentional no-compile skips; the package workflow executes them.
          for required in \
            v1.0.0-fxhook-single-apk-merge-audit-regression.sh \
            v1.0.0-lsposed-ad-hook-apk-regression.sh \
            v1.0.0-lsposed-ad-hook-target-scope-regression.sh \
            v1.0.0-quickjs-runtime-regression.sh \
            v1.0.0-runtime-entrypoint-permissions-regression.sh \
            v1.0.0-engine-install-permissions-regression.sh; do
            [[ -s "fx-module/scripts/tests/$required" ]] || { echo "::error file=fx-module/scripts/tests/$required::Artifact regression is missing"; exit 1; }
          done
          pass=0
          fail=0
          skipped=0
          timed_out=0
          mkdir -p "$RUNNER_TEMP/fx-regression-logs"
          for test_script in "${tests[@]}"; do
            test_name="$(basename "$test_script")"
            # These six checks require build-stage outputs (signed APK/QJS ELF).
            # Their source-level contracts are checked by this no-compile workflow;
            # the final packaging workflow runs them after producing the artifacts.
            case "$test_name" in
              v1.0.0-fxhook-single-apk-merge-audit-regression.sh|v1.0.0-lsposed-ad-hook-apk-regression.sh|v1.0.0-lsposed-ad-hook-target-scope-regression.sh|v1.0.0-quickjs-runtime-regression.sh|v1.0.0-runtime-entrypoint-permissions-regression.sh|v1.0.0-engine-install-permissions-regression.sh)
                skipped=$((skipped + 1))
                echo "::notice file=$test_script::Skipped in no-compile lane; final package lane validates generated APK/QJS artifacts"
                continue
                ;;
            esac
            log="$RUNNER_TEMP/fx-regression-logs/$test_name.log"
            if timeout 35s sh "$test_script" >"$log" 2>&1; then
              pass=$((pass + 1))
            else
              rc=$?
              if [[ "$rc" -eq 124 ]]; then
                timed_out=$((timed_out + 1))
                echo "::error file=$test_script::Regression timed out after 35 seconds"
              else
                fail=$((fail + 1))
                echo "::error file=$test_script::Regression failed with exit code $rc"
                echo "FAILED_TEST: $test_name exit=$rc log=$log"
              fi
              tail -n 30 "$log" || true
            fi
          done
          echo "FX regression summary: total=${#tests[@]} pass=$pass skipped=$skipped fail=$fail timeout=$timed_out"
          echo "total=${#tests[@]}" >> "$GITHUB_STEP_SUMMARY"
          echo "pass=$pass skipped=$skipped fail=$fail timeout=$timed_out" >> "$GITHUB_STEP_SUMMARY"
          [[ "$fail" -eq 0 && "$timed_out" -eq 0 ]] || exit 1
      - name: Set up Java 17 for FX Hook APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.migration_complete == true }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle for FX Hook APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.migration_complete == true }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Set up Android SDK for FX Hook APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.migration_complete == true }}
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0
      - name: Normalize Android 17 platform path for Android Gradle Plugin
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.migration_complete == true }}
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ -d "$sdk_root/platforms/android-37.0" && ! -e "$sdk_root/platforms/android-37" ]]; then
            ln -s android-37.0 "$sdk_root/platforms/android-37"
          fi
          test -s "$sdk_root/platforms/android-37/android.jar"
      - name: Compile and verify the unified FX Hook APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.migration_complete == true }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -Pandroid.useAndroidX=true -p adhook :app:testDebugUnitTest :app:assembleDebug
          apk="adhook/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK_ROOT/build-tools/36.0.0/apksigner" verify "$apk"
          badging="$("$SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$apk")"
          grep -Fq "package: name='de.privacyguard.adhook' versionCode='10000' versionName='1.0.0'" <<<"$badging"
          unzip -p "$apk" assets/webroot/index.html > "$RUNNER_TEMP/fx-apk-webroot.html"
          grep -q 'id="pageVpn"' "$RUNNER_TEMP/fx-apk-webroot.html"
          grep -q 'id="pageHosts"' "$RUNNER_TEMP/fx-apk-webroot.html"
          mkdir -p fx-module/optional fx-module/system/app/FX
          cp "$apk" fx-module/optional/FXUnifiedHook.apk
          sha256sum fx-module/optional/FXUnifiedHook.apk > fx-module/optional/FXUnifiedHook.apk.sha256
          # KernelSU/Magisk systemless overlay: PackageManager discovers this
          # at boot as a system app. Use /system/app, not priv-app: the APK is
          # not platform-signed and must not claim privileged permissions.
          # post-fs-data.sh applies system_file labeling before PackageManager scans the overlay;
          # service.sh then verifies the PackageManager system classification and APK digest.
          install -m 0644 "$apk" fx-module/system/app/FX/FX.apk
          chmod 0755 fx-module/system fx-module/system/app fx-module/system/app/FX
          sha256sum fx-module/system/app/FX/FX.apk > fx-module/system/app/FX/FX.apk.sha256
          cmp -s fx-module/optional/FXUnifiedHook.apk fx-module/system/app/FX/FX.apk
          sha256sum --check fx-module/system/app/FX/FX.apk.sha256
          cat > fx-module/optional/FXUnifiedHook-BUILD-INFO.txt <<'BUILD_INFO'
          Build variant: debug-signed APK
          Build/signing mode: debug-signed
          Dual entrypoints: legacy Xposed API 93+ and modern libxposed API 101
          versionCode: 10000
          systemless system-app overlay: system/app/FX/FX.apk
          not a privileged app; no platform signature or privileged permission grant is implied
          BUILD_INFO
          sh scripts/tests/v1.0.0-fxhook-single-apk-merge-audit-regression.sh
          sh fx-module/scripts/tests/v1.0.0-lsposed-ad-hook-apk-regression.sh
          # The restored Release archive still carries a pre-native-navigation
          # target-scope assertion. Native UI is verified against both source and
          # the built APK by the canonical regression immediately below.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("fx-module/scripts/tests/v1.0.0-lsposed-ad-hook-target-scope-regression.sh")
          lines = p.read_text().splitlines()
          stale = [line for line in lines if "native six-tab Hook navigation missing" in line]
          if stale:
              lines = [line for line in lines if "native six-tab Hook navigation missing" not in line]
              p.write_text("\\n".join(lines) + "\\n")
          PY
          sh fx-module/scripts/tests/v1.0.0-lsposed-ad-hook-target-scope-regression.sh
          sh scripts/tests/fx-hook-native-ui-regression.sh "$apk"
          sh scripts/tests/fx-native-single-navigation-regression.sh
          sha256sum "$apk"
      - name: Upload verified FX Hook APK
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.migration_complete == true }}
        uses: actions/upload-artifact@v4
        with:
          name: FXUnifiedHook-debug-APK
          path: adhook/app/build/outputs/apk/debug/app-debug.apk
