name: Validate FX APP UI migration (no compile)

on:
  push:
    branches: [fx-hook-audit160, fx-v1.0.0-unified-hook-integration]
    paths:
      - "adhook/**"
      - "fx-patches/**"
      - "fx-module/**"
      - ".github/workflows/build-fx-adhook.yml"
      - "scripts/install_adhook_app.sh"
      - "fx-module/scripts/install_adhook_app.sh"
      - "scripts/remove_adhook_app.sh"
      - "fx-module/scripts/install_adhook_app.sh"
      - "scripts/tests/**"
  pull_request:
    branches: [main]
    paths:
      - "adhook/**"
      - ".github/workflows/build-fx-adhook.yml"
      - "scripts/install_adhook_app.sh"
      - "scripts/remove_adhook_app.sh"
      - "fx-module/scripts/install_adhook_app.sh"
      - "scripts/tests/adhook-app-installer-regression.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-migration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore module sources, merge Hook entrypoints, and stage WebUI (no compile)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fx-release" "$RUNNER_TEMP/fx-unpack" adhook/app/src/main/assets/webroot
          gh release download 1.0.0 --repo vip-svip/SY --pattern 'FX-v1.0.0.zip' --dir "$RUNNER_TEMP/fx-release"
          unzip -tq "$RUNNER_TEMP/fx-release/FX-v1.0.0.zip"
          unzip -q "$RUNNER_TEMP/fx-release/FX-v1.0.0.zip" -d "$RUNNER_TEMP/fx-unpack"
          module_prop="$(find "$RUNNER_TEMP/fx-unpack" -type f -name module.prop -print -quit)"
          test -n "$module_prop"
          source_root="$(dirname "$module_prop")"
          rm -rf fx-module
          mkdir -p fx-module
          cp -a "$source_root/." fx-module/
          python3 fx-patches/patch_remote_config_parser.py fx-module
          python3 fx-patches/patch_hook_apk_regression.py fx-module
          python3 fx-patches/patch_hook_privacy_controls.py fx-module
          python3 fx-patches/patch_native_hook_config_overlay.py fx-module
          python3 fx-patches/patch_vpncore_default_node.py fx-module
          python3 fx-patches/patch_vpn_yaml_inline_comments.py fx-module
          python3 fx-patches/patch_vpnsub_clash_reality.py fx-module
          python3 fx-patches/patch_vpnsub_clash_transports.py fx-module
          python3 fx-patches/merge_hook_single_apk.py fx-module .
          cp fx-module/webroot/index.html adhook/app/src/main/assets/webroot/index.html
          python3 fx-patches/merge_ad_hosts_ui.py adhook/app/src/main/assets/webroot/index.html
          test "$(wc -c < adhook/app/src/main/assets/webroot/index.html)" -gt 500000
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("adhook/app/src/main/assets/webroot/index.html").read_text(encoding="utf-8")
          for page_id in ("pageAd", "pageHosts"):
              start = html.find('id="' + page_id + '"')
              if start < 0:
                  start = html.find("id='" + page_id + "'")
              if start < 0:
                  print(f"::error::Cannot locate {page_id} in staged WebUI")
                  raise SystemExit(1)
              next_page = re.search(r"""<[^>]+id=["']page[A-Z]""", html[start + 1:])
              end = start + 1 + next_page.start() if next_page else len(html)
              fragment = html[start:end]
              ids = re.findall(r"""id=["']([^"']+)["']""", fragment)
              controls = re.findall(r'<(?:input|select|button)\b[^>]*>', fragment, re.I)
              print(f"UI_STRUCTURE {page_id}: ids={ids[:100]} controls={controls[:100]}")
          PY
          test -s adhook/app/src/main/java/de/privacyguard/hook/MainHook.java
          grep -q 'de.privacyguard.hook.MainHook' adhook/app/src/main/assets/xposed_init
          grep -q 'android:label="FX"' adhook/app/src/main/AndroidManifest.xml
      - name: Run static migration checks only (no compile)
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/tests/fx-app-webui-migration-regression.sh
          sh scripts/tests/vpncore-default-node-fallback-regression.sh
          sh fx-module/scripts/tests/v1.0.0-clash-reality-yaml-regression.sh
          sh fx-module/scripts/tests/v1.0.0-clash-transport-yaml-regression.sh
          sh scripts/tests/adhook-app-installer-regression.sh
          python3 scripts/tests/fx-native-hook-overlay-patcher-regression.py
          for test in fx-module/scripts/tests/v1.0.0-fileedit-*-regression.sh fx-module/scripts/tests/v1.0.0-hosts-*-regression.sh fx-module/scripts/tests/v1.0.0-ad-*-regression.sh fx-module/scripts/tests/v1.0.0-adult-content-domain-list-regression.sh fx-module/scripts/tests/v1.0.0-adult-site-ad-*-regression.sh; do
            [ -f "$test" ] || continue
            echo "RUN MODULE REGRESSION: $test"
            if [[ "$test" == *"hosts-cache-concurrency-regression.sh" ]]; then
              for attempt in $(seq 1 10); do
                echo "hosts cache concurrency attempt $attempt/10"
                sh "$test"
              done
            else
              sh "$test"
            fi
          done
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("adhook/app/src/main/AndroidManifest.xml")
          source = open("adhook/app/src/main/java/de/privacyguard/adhook/MainActivity.java", encoding="utf-8").read()
          bridge = open("adhook/app/src/main/java/de/privacyguard/adhook/RootBridge.java", encoding="utf-8").read()
          root = open("adhook/app/src/main/java/de/privacyguard/adhook/RootAccess.java", encoding="utf-8").read()
          assert "new WebViewClientCompat()" in source
          assert "shouldOverrideUrlLoading" in source and "appassets.androidplatform.net" in source
          assert "setAllowFileAccess(false)" in source and "FXRoot.exec" in source
          assert "CALLBACK" in bridge and "JSONObject.quote" in bridge
          assert "new ProcessBuilder(\"su\", \"-c\", command)" in root
          assert "process.waitFor" in root
          assert "saveBase64" in bridge and "MediaStore.Downloads" in bridge
          print("PASS: manifest XML and APP/Root bridge source invariants")
          PY
      - name: Run complete FX host regression suite (no compile)
        shell: bash
        run: |
          set -uo pipefail
          mapfile -t tests < <(find fx-module/scripts/tests -maxdepth 1 -type f -name '*.sh' | sort)
          test "${#tests[@]}" -ge 250 || { echo "::error::Expected the complete FX regression suite; found only ${#tests[@]} scripts."; exit 1; }
          pass=0
          fail=0
          skipped=0
          timed_out=0
          mkdir -p "$RUNNER_TEMP/fx-regression-logs"
          for test_script in "${tests[@]}"; do
            test_name="$(basename "$test_script")"
            # These six checks require build-stage outputs (signed APK/QJS ELF).
            # Their source-level contracts are checked by this no-compile workflow;
            # the final packaging workflow runs them after producing the artifacts.
            case "$test_name" in
              v1.0.0-fxhook-single-apk-merge-audit-regression.sh|v1.0.0-lsposed-ad-hook-apk-regression.sh|v1.0.0-lsposed-ad-hook-target-scope-regression.sh|v1.0.0-quickjs-runtime-regression.sh|v1.0.0-runtime-entrypoint-permissions-regression.sh|v1.0.0-engine-install-permissions-regression.sh)
                skipped=$((skipped + 1))
                echo "::notice file=$test_script::Skipped in no-compile lane; final package lane validates generated APK/QJS artifacts"
                continue
                ;;
            esac
            log="$RUNNER_TEMP/fx-regression-logs/$test_name.log"
            if timeout 35s sh "$test_script" >"$log" 2>&1; then
              pass=$((pass + 1))
            else
              rc=$?
              if [[ "$rc" -eq 124 ]]; then
                timed_out=$((timed_out + 1))
                echo "::error file=$test_script::Regression timed out after 35 seconds"
              else
                fail=$((fail + 1))
                echo "::error file=$test_script::Regression failed with exit code $rc"
                echo "FAILED_TEST: $test_name exit=$rc log=$log"
              fi
              tail -n 30 "$log" || true
            fi
          done
          echo "FX regression summary: total=${#tests[@]} pass=$pass skipped=$skipped fail=$fail timeout=$timed_out"
          echo "total=${#tests[@]}" >> "$GITHUB_STEP_SUMMARY"
          echo "pass=$pass skipped=$skipped fail=$fail timeout=$timed_out" >> "$GITHUB_STEP_SUMMARY"
          [[ "$fail" -eq 0 && "$timed_out" -eq 0 ]] || exit 1
      - name: Upload FX host regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fx-v1.0.0-host-regression-logs
          path: ${{ runner.temp }}/fx-regression-logs/
          if-no-files-found: warn
          retention-days: 3
      - name: Preserve restored module source for focused audit
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fx-v1.0.0-module-source-audit
          retention-days: 3
          if-no-files-found: error
          path: |
            fx-module/module.prop
            fx-module/customize.sh
            fx-module/post-fs-data.sh
            fx-module/service.sh
            fx-module/uninstall.sh
            fx-module/scripts/
            fx-module/webroot/index.html
