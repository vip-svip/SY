name: FX 1.0.0 cloud compile validation (API82+API101 single APK)

on:
  push:
    branches: [fx-v1.0.0-cloud-validation]
    paths:
      - "adhook/**"
      - "scripts/tests/**"
      - "scripts/install_adhook_app.sh"
      - "scripts/remove_adhook_app.sh"
      - "fx-module/scripts/**"
      - "tools/fx-api101-source/**"
      - "tools/fx-api82-source/**"
      - ".github/workflows/fx-cloud-validation.yml"

permissions:
  contents: read

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f 2>/dev/null | sort | tail -n1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-34" "build-tools;34.0.0"

      - name: Restore exact local FX Hook source snapshot
        shell: bash
        run: |
          base64 -d tools/fx-api101-source/AdVisibilityHook.java.gz.b64 | gzip -dc > adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java
          echo "658b49b63159e7071ca3e22e158435b5833e5c1d82fe64543c2ac88266f0a02f  adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java" | sha256sum -c -
          python3 tools/fx-api101-source/patch_rewarded_flow.py
          echo "b3fa4c33d1efebad7681cf7afc7433073c036e41ea71f6d97ff0ad0aa8b92b86  adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java" | sha256sum -c -
          python3 tools/fx-api101-source/patch_radio_privacy.py
          echo "0d8d93d911d89e9a084f6160511cfc2dac40915652091fc9ac36ffeec3625c48  adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java" | sha256sum -c -
          python3 tools/fx-api101-source/patch_camera_id_privacy.py
          echo "550aef6699758c72c6c1237a521bbf022ca7f66e33b820a1b5e4c04007f21368  adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java" | sha256sum -c -
          python3 tools/fx-api101-source/patch_microphone_privacy.py
          echo "155423b0452ba5866449695bc21795622f2bf5bd44a54ec121911c1a982ec4b3  adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java" | sha256sum -c -
          python3 tools/fx-api101-source/patch_passive_location_privacy.py
          echo "130da4f15b96def49dfb8e5f83170f38d6aa3b847e6afc284b8d894ab4d892cf  adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java" | sha256sum -c -
          python3 tools/fx-api101-source/patch_region_diagnostics.py
          echo "6dd32af956e427f8f0b3f012f7e2631fef7860e2a7de230328d583864d99ad28  adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java" | sha256sum -c -
          python3 tools/fx-api101-source/patch_mediastore_privacy.py
          echo "ebaec0c3089990a3c2994518abda42cd4f57bf5c5e6f6957e67c0ec4d63d5e1a  adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java" | sha256sum -c -
          python3 tools/fx-api101-source/patch_microphone_hardware_privacy.py
          sha256sum adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java
          echo "654d39cea7bb3c1c19bebf1dbd56808e395a66de7edc161d7d12d7c8dcb3fdbf  adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java" | sha256sum -c -
          python3 tools/fx-api101-source/patch_audio_fingerprint_privacy.py
          sha256sum adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java
          echo "fb46869ec48b21592927d39b0ae06143bb53b6c3578f7a15b1eda06d60cfd45f  adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java" | sha256sum -c -
          python3 tools/fx-api101-source/patch_clipboard_isolation.py
          sha256sum adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java
          python3 tools/fx-api101-source/patch_notification_privacy.py
          sha256sum adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java
          echo "5121fcc4ec803390c691154cdacbd3c4d1443bf26db45fa05a5fe5f6a2e64dcf  adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java" | sha256sum -c -
          python3 tools/fx-api101-source/patch_biometric_privacy.py
          sha256sum adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java
          mkdir -p adhook/app/src/main/java/de/privacyguard/hook
          cat tools/fx-api82-source/MainHook.gz.b64.part1 tools/fx-api82-source/MainHook.gz.b64.part2 tools/fx-api82-source/MainHook.gz.b64.part3 tools/fx-api82-source/MainHook.gz.b64.part3b tools/fx-api82-source/MainHook.gz.b64.part4 tools/fx-api82-source/MainHook.gz.b64.part5 tools/fx-api82-source/MainHook.gz.b64.part6 tools/fx-api82-source/MainHook.gz.b64.part6b tools/fx-api82-source/MainHook.gz.b64.part7 tools/fx-api82-source/MainHook.gz.b64.part8 | base64 -d | gzip -dc > adhook/app/src/main/java/de/privacyguard/hook/MainHook.java
          echo "77cec8b8e28b3673b4c8badc93aa1e1a49dff2f289779d4ca72b97b1f0dcc562  adhook/app/src/main/java/de/privacyguard/hook/MainHook.java" | sha256sum -c -
          python3 tools/fx-api82-source/patch_shared_uid_guard.py
          echo "89318e226aaedaca2b9a5917791426c815ada47b29d4b16f3dd6e25774235017  adhook/app/src/main/java/de/privacyguard/hook/MainHook.java" | sha256sum -c -
      - name: Validate API82 and API101 single-APK wiring
        shell: bash
        run: |
          JAVA_SRC=adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java
          PARSER_SRC=adhook/app/src/main/java/de/privacyguard/adhook/UnifiedHookConfigParser.java
          test -s "$JAVA_SRC"
          test -s "$PARSER_SRC"
          grep -q 'UnifiedHookConfigParser.parse' "$JAVA_SRC"
          grep -q 'io.github.libxposed:api:101.0.1' adhook/app/build.gradle
          grep -q 'de.robv.android.xposed:api:82' adhook/app/build.gradle
          grep -q 'xposedmodule' adhook/app/src/main/AndroidManifest.xml
          grep -q 'de.privacyguard.hook.MainHook' adhook/app/src/main/assets/xposed_init
          grep -q 'isModernLibXposedRuntimeAvailable' adhook/app/src/main/java/de/privacyguard/hook/MainHook.java
          grep -q 'SELF_PKG_API101' adhook/app/src/main/java/de/privacyguard/hook/MainHook.java
          grep -q 'minApiVersion=101' adhook/app/src/main/resources/META-INF/xposed/module.prop
          test -s adhook/app/src/main/resources/META-INF/xposed/java_init.list
          test -f adhook/app/src/main/resources/META-INF/xposed/scope.list
          bash scripts/tests/v1.0.0-android-id-shared-process-fail-open-regression.sh
          bash scripts/tests/v1.0.0-member-observation-bounded-regression.sh
          bash scripts/tests/v1.0.0-global-hook-shared-process-fail-open-regression.sh
          bash scripts/tests/v1.0.0-rewarded-ad-flow-preservation-regression.sh
          bash scripts/tests/v1.0.0-radio-privacy-api101-regression.sh
          bash scripts/tests/v1.0.0-camera-id-privacy-api101-regression.sh
          bash scripts/tests/adhook-app-installer-regression.sh
          bash scripts/tests/v1.0.0-api82-api101-single-apk-regression.sh
          bash scripts/tests/v1.0.0-microphone-privacy-api101-regression.sh
          bash scripts/tests/v1.0.0-passive-location-privacy-api101-regression.sh
          bash scripts/tests/v1.0.0-region-compatibility-diagnostic-api101-regression.sh
          bash scripts/tests/v1.0.0-mediastore-privacy-api101-regression.sh
          bash scripts/tests/v1.0.0-microphone-hardware-privacy-api101-regression.sh
          bash scripts/tests/v1.0.0-audio-fingerprint-privacy-api101-regression.sh
          bash scripts/tests/v1.0.0-clipboard-isolation-api101-regression.sh
          bash scripts/tests/v1.0.0-notification-system-surface-privacy-api101-regression.sh
          bash scripts/tests/v1.0.0-biometric-hardware-privacy-api101-regression.sh

      - name: Run unit tests and assemble APK
        run: gradle --no-daemon -p adhook :app:testDebugUnitTest :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK=adhook/app/build/outputs/apk/debug/app-debug.apk
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -s "$APK"
          "$SDK_ROOT/build-tools/34.0.0/apksigner" verify "$APK"
          unzip -l "$APK" | grep -q 'META-INF/xposed/java_init.list'
          unzip -l "$APK" | grep -q 'META-INF/xposed/module.prop'
          unzip -l "$APK" | grep -q 'assets/xposed_init'
          DEX_DIR="$(mktemp -d)"
          unzip -q "$APK" 'classes*.dex' -d "$DEX_DIR"
          DEX_HIT=0
          for dex in "$DEX_DIR"/classes*.dex; do
            if strings "$dex" | grep -q 'de/privacyguard/hook/MainHook'; then DEX_HIT=1; break; fi
          done
          test "$DEX_HIT" -eq 1
          "$SDK_ROOT/build-tools/34.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > "$DEX_DIR/manifest.txt"
          grep -q 'xposedmodule' "$DEX_DIR/manifest.txt"

      - name: Upload validation APK
        uses: actions/upload-artifact@v4
        with:
          name: FXHook-API82-API101-single-apk-validation
          path: adhook/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload exact compiled API 101 source
        uses: actions/upload-artifact@v4
        with:
          name: FXAdHook-API101-source-snapshot
          path: adhook/app/src/main/java/de/privacyguard/adhook/AdVisibilityHook.java
          if-no-files-found: error
