name: FX Apply
on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fx-v1.0.0-unified-hook-integration

      - name: Write files
        run: |
          mkdir -p module/fx-system/bin

          cat > module/fx-system/module.prop << 'EOF'
          id=fx-system
          name=FX 1.0.0 System App & Kernel VPN
          version=1.0.0
          versionCode=10000
          author=FX
          description=将 FX 部署为系统应用，并提供内核 VPN 独立通道与本地 DNS 守护。
          EOF

          cat > module/fx-system/customize.sh << 'OUTER'
          #!/system/bin/sh
          SKIPUNZIP=0
          ui_print "- FX 1.0.0 系统应用部署开始"
          mkdir -p "$MODPATH/system/priv-app/FX"
          unzip -o "$ZIPFILE" 'system/priv-app/FX/FX.apk' -d "$MODPATH" >&2
          set_perm_recursive "$MODPATH/system/priv-app/FX" 0 0 0755 0644
          PRIVAPP_XML="$MODPATH/system/etc/permissions/privapp-permissions-com.fx.app.xml"
          mkdir -p "$(dirname "$PRIVAPP_XML")"
          cat > "$PRIVAPP_XML" << 'INNER'
          <?xml version="1.0" encoding="utf-8"?>
          <permissions>
              <privapp-permissions package="com.fx.app">
                  <permission name="android.permission.INTERNET"/>
                  <permission name="android.permission.ACCESS_NETWORK_STATE"/>
                  <permission name="android.permission.FOREGROUND_SERVICE"/>
                  <permission name="android.permission.POST_NOTIFICATIONS"/>
                  <permission name="android.permission.QUERY_ALL_PACKAGES"/>
              </privapp-permissions>
          </permissions>
          INNER
          set_perm "$PRIVAPP_XML" 0 0 0644
          ui_print "- 系统应用部署完成，重启后生效"
          OUTER

          cat > module/fx-system/post-fs-data.sh << 'EOF'
          #!/system/bin/sh
          MODDIR=${0%/*}
          APK="$MODDIR/system/priv-app/FX/FX.apk"
          [ -f "$APK" ] && chcon u:object_r:system_file:s0 "$APK" 2>/dev/null
          [ -f "$APK" ] && chmod 0644 "$APK"
          EOF

          cat > module/fx-system/service.sh << 'EOF'
          #!/system/bin/sh
          MODDIR=${0%/*}
          until [ "$(getprop sys.boot_completed)" = "1" ]; do sleep 2; done
          am start-foreground-service -n com.fx.app/.FxSystemService 2>/dev/null
          [ -x "$MODDIR/bin/fx-kernel-vpn" ] && "$MODDIR/bin/fx-kernel-vpn" --daemon --dns-port 5353 &
          EOF

          cat > module/fx-system/bin/fx-kernel-vpn << 'EOF'
          #!/system/bin/sh
          TUN_DEV="fxtun0"
          TUN_LOCAL="10.88.0.1"
          TABLE_ID="8801"
          DNS_PORT="${DNS_PORT:-5353}"

          setup() {
            ip tuntap add dev "$TUN_DEV" mode tun 2>/dev/null
            ip addr add "$TUN_LOCAL/24" dev "$TUN_DEV" 2>/dev/null
            ip link set "$TUN_DEV" up
            ip route add default dev "$TUN_DEV" table "$TABLE_ID" 2>/dev/null
            ip rule add fwmark 0x8801 lookup "$TABLE_ID" priority 18801 2>/dev/null
            iptables -t mangle -A OUTPUT -p udp --dport 53 -j MARK --set-mark 0x8801 2>/dev/null
            iptables -t mangle -A OUTPUT -p tcp --dport 53 -j MARK --set-mark 0x8801 2>/dev/null
            iptables -t nat -A OUTPUT -p udp --dport 53 -j REDIRECT --to-ports "$DNS_PORT" 2>/dev/null
            iptables -t nat -A OUTPUT -p tcp --dport 53 -j REDIRECT --to-ports "$DNS_PORT" 2>/dev/null
          }

          teardown() {
            ip rule del fwmark 0x8801 lookup "$TABLE_ID" priority 18801 2>/dev/null
            ip route flush table "$TABLE_ID" 2>/dev/null
            ip link del "$TUN_DEV" 2>/dev/null
          }

          trap teardown EXIT INT TERM
          setup
          while true; do sleep 60; done
          EOF

          cat > module/fx-system/bin/fx-local-dns << 'EOF'
          #!/system/bin/sh
          DNS_PORT="${1:-5353}"
          ADG_HOME="/data/adb/modules/fx-system/dns"
          [ -x "$ADG_HOME/AdGuardHome" ] && \
            "$ADG_HOME/AdGuardHome" -c "$ADG_HOME/AdGuardHome.yaml" -w "$ADG_HOME" \
              --web-addr "127.0.0.1:3000" --dns-port "$DNS_PORT" &
          EOF

          chmod 0755 module/fx-system/customize.sh \
                     module/fx-system/post-fs-data.sh \
                     module/fx-system/service.sh \
                     module/fx-system/bin/fx-kernel-vpn \
                     module/fx-system/bin/fx-local-dns

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "feat(module): auto-deploy FX as system app + kernel vpn + local dns"
          branch: fx-v1.0.0-unified-hook-integration
