name: FX Module Source Recovery

on:
  push:
    branches:
      - fx-v1.0.0-unified-hook-integration
    paths:
      - .github/workflows/fx-module-source-recovery.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
      - name: Recover canonical FX module scripts from the existing 1.0.0 release
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/FX-v1.0.0.zip"
          unpack="$RUNNER_TEMP/fx-module-unpack"
          curl --fail --silent --show-error --location \
            https://github.com/vip-svip/SY/releases/download/1.0.0/FX-v1.0.0.zip \
            -o "$archive"
          unzip -tq "$archive"
          mkdir -p "$unpack" recovered-fx-module
          unzip -q "$archive" -d "$unpack"
          module_prop="$(find "$unpack" -maxdepth 3 -type f -name module.prop -print -quit)"
          [[ -n "$module_prop" ]] || { echo "::error::No module.prop in the published FX module archive"; exit 1; }
          source_root="$(dirname "$module_prop")"
          [[ -d "$source_root/scripts" ]] || { echo "::error::Published FX module has no scripts directory"; exit 1; }
          # The checked-in fx-module tree is an overlay, not the complete runtime.
          # Validate the exact core files consumed by service.sh, the coexistence
          # arbiter, and the package workflow before publishing this recovery snapshot.
          required=(
            module.prop customize.sh post-fs-data.sh service.sh uninstall.sh
            scripts/apply.sh scripts/default.conf scripts/util.sh scripts/certmgr.sh
            scripts/vpn-external-watchdog.sh
          )
          for file in "${required[@]}"; do
            [[ -s "$source_root/$file" ]] || {
              echo "::error::Published FX module is incomplete: missing $file"
              exit 1
            }
          done
          sha256sum "$source_root/scripts/vpn-external-watchdog.sh"
          # Recover the entire canonical module tree, including bin/, libs,
          # optional payloads and legacy scripts; overlay current branch sources
          # immediately afterwards so no newer reviewed fix is rolled back.
          cp -a "$source_root/." recovered-fx-module/
          # Merge current branch-owned module overlays over the historical Release baseline.
          if [[ -d fx-module/scripts ]]; then
            cp -a fx-module/scripts/. recovered-fx-module/scripts/
          fi
          for file in module.prop customize.sh post-fs-data.sh service.sh uninstall.sh; do
            [[ ! -s "fx-module/$file" ]] || install -m 0755 "fx-module/$file" "recovered-fx-module/$file"
          done
          # The module ZIP deliberately retires its WebUI; recover the canonical
          # UI from the exact standalone APK asset used by the module build.
          apk="$RUNNER_TEMP/FXUnifiedHook.apk"
          curl --fail --silent --show-error --location \
            https://github.com/vip-svip/SY/releases/download/1.0.0/FXUnifiedHook.apk \
            -o "$apk"
          mkdir -p recovered-fx-module/webroot
          unzip -p "$apk" assets/webroot/index.html > recovered-fx-module/webroot/index.html
          [[ "$(wc -c < recovered-fx-module/webroot/index.html)" -gt 500000 ]] || {
            echo "::error::Recovered WebUI is not the complete packaged UI"; exit 1;
          }
          if [[ -d "$source_root/bin" ]]; then
            find "$source_root/bin" -type f -printf '%P\t%s bytes\n' | sort > recovered-fx-module/BIN-MANIFEST.txt
          fi
          sha256sum "$archive" > recovered-fx-module/RELEASE-ARCHIVE-SHA256.txt
          # Provide a per-file integrity manifest so later source integration can
          # verify provenance without dumping the recovered runtime into CI logs.
          (
            cd recovered-fx-module
            find . -type f ! -name SOURCE-SHA256SUMS.txt -print0 |
              sort -z | xargs -0 -r sha256sum > SOURCE-SHA256SUMS.txt
          )
          printf '%s\n' "source=GitHub Release 1.0.0" "archive=FX-v1.0.0.zip" \
            "recovery_branch=$GITHUB_REF_NAME" "recovery_commit=$GITHUB_SHA" \
            > recovered-fx-module/SOURCE-ORIGIN.txt
          find recovered-fx-module -type f | sort
      - name: Upload recovered source snapshot for code integration
        uses: actions/upload-artifact@v4
        with:
          name: fx-module-source-snapshot
          path: recovered-fx-module/
          if-no-files-found: error
          retention-days: 1
      - name: Publish recovered module source for integration
        shell: bash
        run: |
          set -euo pipefail
          # If the recovery PR branch already exists, merge the newest shared
          # integration HEAD into it. This refreshes the PR's merge base without
          # force-pushing or discarding commits made by parallel agents.
          if git ls-remote --exit-code --heads origin fx-module-source-recovery >/dev/null 2>&1; then
            git fetch origin \
              "+refs/heads/$GITHUB_REF_NAME:refs/remotes/origin/$GITHUB_REF_NAME" \
              "+refs/heads/fx-module-source-recovery:refs/remotes/origin/fx-module-source-recovery"
            git checkout -B fx-module-source-recovery origin/fx-module-source-recovery
            git merge --no-edit "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:refs/heads/fx-module-source-recovery"
            echo "::notice::Merged the latest shared integration HEAD into fx-module-source-recovery."
            exit 0
          fi
          mkdir -p docs/fx-module-recovery
          for file in BIN-MANIFEST.txt RELEASE-ARCHIVE-SHA256.txt SOURCE-SHA256SUMS.txt SOURCE-ORIGIN.txt; do
            [[ ! -s "recovered-fx-module/$file" ]] || {
              install -m 0644 "recovered-fx-module/$file" "docs/fx-module-recovery/$file"
              rm "recovered-fx-module/$file"
            }
          done
          mkdir -p fx-module
          cp -a recovered-fx-module/. fx-module/
          git add fx-module docs/fx-module-recovery
          if git diff --cached --quiet; then
            echo "Recovered module source already matches the branch."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(module): restore canonical FX 1.0.0 runtime sources"
          # Isolate the large source import from concurrent commits to the shared target.
          git push origin "HEAD:refs/heads/fx-module-source-recovery"
          echo "::notice::Source branch published. Open/review the integration PR separately."
