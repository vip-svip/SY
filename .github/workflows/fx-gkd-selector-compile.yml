name: FX GKD Selector JVM Compile

on:
  push:
    branches:
      - fx-v1.0.0-unified-hook-integration
    paths:
      - '.gitmodules'
      - 'vendor/GKD-XA'
      - 'adhook/build.gradle'
      - 'adhook/settings.gradle'
      - 'adhook/fx-gkd-selector/**'
      - 'adhook/app/build.gradle'
      - 'adhook/app/src/test/**'
      - 'adhook/fx-gkd-selector/**'
      - 'adhook/fx-gkd-selector/**'
      - '.github/workflows/fx-gkd-selector-compile.yml'
  pull_request:
    branches:
      - fx-v1.0.0-unified-hook-integration
    paths:
      - '.gitmodules'
      - 'vendor/GKD-XA'
      - 'adhook/build.gradle'
      - 'adhook/settings.gradle'
      - 'adhook/fx-gkd-selector/**'
      - 'adhook/app/build.gradle'
      - 'adhook/app/src/test/**'

permissions:
  contents: read

concurrency:
  group: fx-gkd-selector-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-pinned-selector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Verify the exact GKD-XA source pin
        shell: bash
        run: |
          set -euo pipefail
          expected='8a6ce935da11671dac7e1a7595416ec99ee07436'
          actual="$(git -C vendor/GKD-XA rev-parse HEAD)"
          [[ "$actual" = "$expected" ]] || {
            echo "::error::Unexpected GKD-XA source commit: $actual"
            exit 1
          }
          test -s vendor/GKD-XA/LICENSE
          grep -qi 'GNU GENERAL PUBLIC LICENSE' vendor/GKD-XA/LICENSE
          echo "GKD-XA source pinned: $actual (GPL-3.0)"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0
      - name: Normalize Android 17 platform path for Android Gradle Plugin
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ -d "$sdk_root/platforms/android-37.0" && ! -e "$sdk_root/platforms/android-37" ]]; then
            ln -s android-37.0 "$sdk_root/platforms/android-37"
          fi
          test -s "$sdk_root/platforms/android-37/android.jar"
      - name: Compile selector, run upstream tests, and compile FX APK Kotlin
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -Pandroid.useAndroidX=true -p adhook \
            :fx-gkd-selector:compileKotlinJvm \
            :fx-gkd-selector:jvmTest \
            :app:compileDebugKotlin
