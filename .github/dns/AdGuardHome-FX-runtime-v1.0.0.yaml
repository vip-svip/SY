http:
  address: 127.0.0.1:0
  session_ttl: 3h
  pprof:
    enabled: false
    port: 6060
  doh:
    routes:
    - GET /dns-query
    - POST /dns-query
    - GET /dns-query/{ClientID}
    - POST /dns-query/{ClientID}
    insecure_enabled: false
users:
- name: fx-local
  password: "$2a$12$2.x1ZQ78RvLwzP0MzwMUPuVOW5e2BHAsdmf8.Z1jaqNc2ZmPDR1z2"
dns:
  bind_hosts:
  - 127.0.0.1
  - ::1
  port: 53
  # All cache misses go to the device-local Unbound recursive resolver.
  # Unbound queries root/TLD/authoritative servers directly, with no fixed
  # Tencent/Alibaba/Cloudflare forwarding resolver.
  upstream_dns:
  - 127.0.0.1:5353
  cache_enabled: true
  cache_size: 4194304
  hostsfile_enabled: false
filtering:
  protection_enabled: true
  filtering_enabled: true
  blocked_response_ttl: 10
  safe_fs_patterns: []
  rewrites: []
  safe_search:
    enabled: false
  blocked_services:
    schedule:
      time_zone: Local
    ids: []
filters: []
user_rules:
  - "||gjfzpt.cn^"
  - "||fzapp-test-tyy.gjfzpt.cn^"
  - "||oss.gjfzpt.cn^"
  - "||fzapp.gjfzpt.cn^"
  - "||fzapph5.gjfzpt.cn^"
querylog:
  enabled: false
  file_enabled: false
  interval: 30d
  size_memory: 1000
  ignored: []
  ignored_enabled: false
statistics:
  enabled: false
  interval: 10d
  ignored: []
  ignored_enabled: false
schema_version: 34
tls:
  enabled: false
