plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def fxReleaseKeystorePath = System.getenv("FX_ANDROID_KEYSTORE_PATH")
def fxReleaseSigningConfigured = fxReleaseKeystorePath != null && !fxReleaseKeystorePath.isEmpty()
android {
    namespace 'de.privacyguard.adhook'
    compileSdk 37
    defaultConfig {
        applicationId 'de.privacyguard.adhook'
        minSdk 28
        targetSdk 34
        versionCode 10000
        versionName '1.0.0'
        // The original Stellar boot launcher executes libstellar.so from
        // ApplicationInfo.nativeLibraryDir; ship only source-verified ABIs.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }
    packaging {
        jniLibs {
            // Native launcher/helper binaries must be extracted to nativeLibraryDir
            // so Root/ADB shell can exec them; JNI loading alone is insufficient.
            useLegacyPackaging true
        }
    }
    signingConfigs {
        fxRelease {
            if (fxReleaseSigningConfigured) {
                storeFile file(fxReleaseKeystorePath)
                storeType "PKCS12"
                storePassword System.getenv("FX_ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("FX_ANDROID_KEY_ALIAS")
                keyPassword System.getenv("FX_ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (fxReleaseSigningConfigured) {
                signingConfig signingConfigs.fxRelease
            }
        }
    }
    buildFeatures {
        compose true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}
dependencies {
    // GPL-3.0 GKD-XA selector engine, isolated from its independent application/runtime.
    implementation project(':fx-gkd-selector')
    // GKD-XA v1.4.8 selector/parser engine; no upstream Application or service is packaged.
    implementation 'androidx.activity:activity:1.11.0'
    // Reuse the original Stellar TLS pairing certificate/key and ADB RSA key codecs.
    implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.86'
    implementation platform('androidx.compose:compose-bom:2025.10.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'top.yukonga.miuix.kmp:miuix-android:0.7.2'
    implementation 'io.github.kyant0:backdrop:1.0.0'
    // Smooth continuous-corner primitives required by Kyant's upstream LiquidBottomTabs.
    implementation 'io.github.kyant0:capsule:2.1.1'
    implementation 'androidx.webkit:webkit:1.12.1'
    // Dia 23.11 used Rosemoe Sora CodeEditor and JavaLanguage for its full-screen editor.
    implementation 'io.github.Rosemoe.sora-editor:editor:0.23.6'
    implementation 'io.github.Rosemoe.sora-editor:language-java:0.23.6'
    // Legacy LSPosed hook adapter remains a compile-only integration surface;
    // the API is supplied by the host framework and is never packaged in FX.
    compileOnly 'de.robv.android.xposed:api:82'
    // Modern LSPosed API enables Remote Files, avoiding SELinux-denied reads of /data/local/tmp.
    compileOnly 'io.github.libxposed:api:101.0.1'
    implementation 'io.github.libxposed:service:102.0.0'
    testImplementation 'junit:junit:4.13.2'
}
