# SY-Fusion 内置 App Hook 子系统配置
# 结构: 每行一个 <tag> <className>#<methodName>
# 作用域由 LSPosed 的 xposed_scope 限定；此表为 App 内置声明式钩子表的事实说明，
# 供面板/维护者核对，App 运行时以 SyHookManager.builtin() 为准。
#
# tag          target
activity      android.app.Activity#onCreate
netif         java.net.NetworkInterface#getNetworkInterfaces
location      android.location.LocationManager#getLastKnownLocation
deviceid      android.telephony.TelephonyManager#getDeviceId
subscriber    android.telephony.TelephonyManager#getSubscriberId
mac           android.net.wifi.WifiInfo#getMacAddress
webview       android.webkit.WebView#loadUrl
