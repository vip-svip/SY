# ============================================================
#  广告拦截·内核增强版 — 主配置
# ============================================================

# ---- 总开关 ----
DNS_ENABLE=1
MITM_ENABLE=0
SPLASH_ENABLE=1
NOTIFY_ENABLE=1
PANEL_ENABLE=1

# ---- DNS 层 ----
DNS_UPSTREAM=1.1.1.1
DNS_UPSTREAM_ENC=https://dns.alidns.com/dns-query
DNS_AUTO_UPDATE=1
DNS_UPDATE_INTERVAL=24

# ---- MITM 层 ----
MITM_PORT=8443
MITM_HTTP_PORT=8080
# 生效应用(逗号分隔包名)；留空=全局(排除root)
MITM_APPS=

# ---- 面板 ----
PANEL_PORT=8848

# ---- 独立 DNS 接管 (DNS 页) ----
DNSSRV_ENABLE=0

# ---- 网络代理 (网络代理页) ----
PROXY_PORT=2080
PROXY_ENABLE=0
# 代理内核 (留空=自动探测 bin/ 下 sing-box/xray)
PROXY_CORE=
# 防 IP 泄露总开关
PROXY_LEAK=0
# 代理订阅自动更新间隔(小时)
PROXY_SUB_INTERVAL=24

# ---- 域名黑名单 (强制拦截，优先级高于白名单) ----
BLACKLIST_ENABLE=1

# ---- 脚本扩展 ----
SCRIPT_UPDATE_INTERVAL=24

# ============================================================
#  融合规则引擎 (AdGuard Home × uBlock Origin)
#  引擎参数留空即使用默认值；修改后需重新编译规则(面板「规则引擎 → 重新编译」)
# ============================================================
# 启发式域名: 从含路径/模式的规则(如 ||cdn.x.com/ads/banner.js)中提取域名，
# 参与 hosts 拦截。1=开启(默认)，0=仅使用纯域名规则
ENGINE_HEURISTIC=1
# 作用域严格模式: 0=忽略 $client/$ctag 限制(默认，兼容单机场景)
#                 1=仅当本机客户端标签匹配规则时该规则才生效
ENGINE_STRICT_SCOPE=0
# 本机客户端标识，对应规则中的 $client=xxx (逗号分隔可填多个)
ENGINE_CLIENT=
# 本机标签组，对应规则中的 $ctag=xxx (逗号分隔可填多个)
ENGINE_CTAG=
# 生成 hosts 时为每个拦截域名额外写入的子域前缀(逗号分隔)，留空则只写裸域名
HOSTS_EXTRA=www

# ---- 外置规则库 (SY-Rules) ----
RULES_REPO=vip-svip/SY-Rules
RULES_BRANCH=main
RULES_MIRROR=

# ============================================================
#  隐私护盾（融合自 GuardShield：反诈/风控应用深度定制）
# ============================================================
# 总开关。开启后按 PRIVACY_TARGETS 清单收紧目标应用的网络与能力面。
PRIVACY_ENABLE=0
# 目标应用包名（逗号分隔）；也可在面板里用可编辑的 targets.conf 逐行维护
PRIVACY_PACKAGES=com.cmcc.fzhs
# 出站封锁动作：REJECT（默认，回拒包，行为可预期）或 DROP（静默丢包，应用只见超时）
PRIVACY_JUMP=REJECT

# 游戏隐私保护（不让游戏读取隐私：收回敏感权限 + 禁剪贴板/使用统计；不冻结不断网）
GAME_PRIVACY_ENABLE=0

# 剪贴板读取监视
CLIPGUARD_ENABLE=0
# 轮询间隔（秒，最小 15）；分段睡眠，关闭后 15s 内退出
CLIPGUARD_INTERVAL=60
# 发现非信任读取者时是否发系统通知
CLIPGUARD_ALERT=1

# 隐私增强域名清单：一键把 rulesets/privacy/* 加入 DNS 过滤（BLACKLIST/自定义规则）
# 0=不自动加入（默认，拦截规则由用户显式选择）
PRIVACY_RULESET_ENABLE=0
